# State-Transition Gate: реестр осей состояния пользователя (WP-457).
#
# Пустой пример-заготовка. Этот файл поставляется шаблоном так: без записей
# State-Transition Gate пропускается с заметкой "гейт перехода состояния не
# настроен" (fail-open), действие не блокируется. Это поведение сохраняется,
# даже когда файл пустой (как сейчас) и когда он содержит записи без
# gate_ready: true.
#
# Три случая, которые гейт различает по числу записей, не по факту
# существования файла:
#   1. записей вообще нет (файла нет ИЛИ files/axes пуст) -> пропуск
#   2. есть запись, но без gate_ready: true -> СТОП/отложить
#      (настройка начата, не закончена)
#   3. есть хотя бы одна gate_ready: true запись -> обычная проверка
#
# Чтобы завести свою ось: скопировать блок ниже (закомментирован), заполнить
# fsm_owner ссылкой на роль/компонент, который реально управляет этим
# переходом в твоей системе, выставить gate_ready: true когда владелец
# подтверждён.
#
# Личный реестр автора шаблона (другой формат содержимого, не копировать) —
# живёт в governance-репозитории автора, не в шаблоне.

axes: []

# Пример записи (раскомментировать и заполнить своими значениями):
#
# axes:
#   - code: my-axis
#     name: "Название оси на твоём языке"
#     fsm_owner: "Роль или компонент, который решает переходы этой оси"
#     gate_ready: false
