# Catalog of local models IWE (WP404, ADR-001).
# Single source of truth for the installer (install-local-llm.sh), monitor (model-monitor.py)
# and lifecycle management (model-lifecycle.py).
#
# Model lifecycle (field status):
#   analysis  — discovered by monitor, under review (not yet downloaded, not yet put into production)
#   testing   — downloaded for evaluation (in cache), being compared against the active model
#   active     — in production (the server loads this one); exactly one
#   archived   — retired from use (outdated/lost the comparison)
# job: privacy=privacy(PII), fallback=no network/tokens, bulk=cheap throughput.
#
# Template default: all models set to analysis. install-local-llm.sh on install
# will make the recommended one (or --max) active for the pilot hardware (or --max) active for the pilot hardware.

updated: 2026-06-10

# Signal sources for biweekly-monitoring (model-monitor.py)
sources:
- name: lmarena
  url: https://lmarena.ai
  note: general quality leaderboard (manual review)
- name: hf-mlx-community
  api: https://huggingface.co/api/models?author=mlx-community&sort=trendingScore&limit=25&pipeline_tag=text-generation
  note: releases of quantized models for Apple Silicon

# Models. status — current state in the lifecycle. min_ram_gb — installer threshold.
models:
- id: mlx-community/Llama-3.2-3B-Instruct-4bit
  status: analysis
  params_b: 3
  quant: 4bit
  min_ram_gb: 8
  job: [privacy]
  note: lightweight for instant privacy on 16GB and below
- id: mlx-community/Qwen2.5-7B-Instruct-4bit
  status: analysis
  params_b: 7
  quant: 4bit
  min_ram_gb: 12
  job: [privacy, fallback]
  recommended: true   # installer default; validated on PII-editing
  note: MVP, general, strong
- id: mlx-community/Qwen2.5-14B-Instruct-4bit
  status: analysis
  params_b: 14
  quant: 4bit
  min_ram_gb: 24
  job: [privacy, fallback, bulk]
  note: for 32GB+, higher quality, slower
