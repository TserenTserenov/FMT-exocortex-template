# Catalog of local IWE models (WP-404, ADR-001).
# A single source for the installer (install-local-llm.sh), the monitor (model-monitor.py)
# and the model states (model-lifecycle.py).
#
# Model states (the status field):
#   analysis  — found by the monitor, under consideration (not yet downloaded, not put into work)
#   testing   — downloaded for verification (in the cache), compared with the active one
#   active     — in work (the server brings up exactly this one); exactly one
#   archived   — withdrawn from use (obsolete/lost the comparison)
# job: privacy=privacy(PII), fallback=no network/tokens, bulk=cheap stream.
#
# Template default: all models are in analysis. On install, install-local-llm.sh
# makes the recommended one (or --max) active for the pilot's hardware.

updated: 2026-06-10

# Signal sources for biweekly monitoring (model-monitor.py)
sources:
- name: lmarena
  url: https://lmarena.ai
  note: общий лидерборд качества (ручная сверка)
- name: hf-mlx-community
  api: https://huggingface.co/api/models?author=mlx-community&sort=trendingScore&limit=25&pipeline_tag=text-generation
  note: релизы квантованных моделей под Apple Silicon

# Models. status — the model's current state. min_ram_gb — the installer's threshold.
models:
- id: mlx-community/Llama-3.2-3B-Instruct-4bit
  status: analysis
  params_b: 3
  quant: 4bit
  min_ram_gb: 8
  job: [privacy]
  note: лёгкая для мгновенной приватности на 16GB и меньше
- id: mlx-community/Qwen2.5-7B-Instruct-4bit
  status: analysis
  params_b: 7
  quant: 4bit
  min_ram_gb: 12
  job: [privacy, fallback]
  recommended: true   # installer default; verified on PII redaction
  note: MVP, general, сильная
- id: mlx-community/Qwen2.5-14B-Instruct-4bit
  status: analysis
  params_b: 14
  quant: 4bit
  min_ram_gb: 24
  job: [privacy, fallback, bulk]
  note: для 32GB+, выше качество, медленнее
