# Адресная книга Почтальона (РП-418 Ф9; роль DP.ROLE.044 §5, обещание DP.SC.134).
#
# Книга описывает виды адресатов: как отправитель называет адресата, где
# Почтальон находит его адрес и какой исполнитель туда доставляет. Это
# указатель, а не копия: личные адреса людей (номера чатов, почта) и секреты
# здесь не пишутся — они остаются в базе или в локальном хранилище, книга
# только называет, где их взять. Проверка: scripts/postman-address-book.py check.
#
# Свои виды адресатов пользователь добавляет в params.yaml, ключ
# postman_addressees, в той же форме. Виды отсюда переопределять нельзя.
#
# Поля строки:
#   kind          вид адресата (латиница, постоянный ключ)
#   title         что это за адресат, по-русски
#   delivery      internal — внутри одной границы владения; external — человеку от платформы
#   name_pattern  как отправитель называет адресата (регулярное выражение)
#   address       где адрес: path:<шаблон пути> или store:<где хранится>
#   closed        (необязательно) если адресат закрыт: when, address и executor
#   executor      кто доставляет: script:<путь от корня IWE> [аргументы] или external:<описание>
#   semantics     как исполнитель держит «один раз» по договору (DP.SC.134):
#                 idempotent | atomic-dedup | dedup-journal | none (договор ещё не подключён, РП-418 Ф10)
#   accepts       что адресат принимает
#   who_may_write кто вправе писать этому адресату
#   status        exists | target
# В шаблонах пути: {governance_repo} — папка репозитория управления, {n} — номер из имени.
schema_version: 1
addressees:
  - kind: wp
    title: рабочий продукт — ящик входящих РП
    delivery: internal
    name_pattern: '^(WP|РП)-(?P<n>[0-9]+)$'
    address: 'path:{governance_repo}/inbox/WP-{n}/INBOX.md'
    closed:
      when: 'path-missing:{governance_repo}/inbox/WP-{n}/WP-{n}.md'
      address: 'path:{governance_repo}/inbox/backlog-with-triggers.md'
      executor: 'external:строка в списке отложенного по протоколу работы («Заявка в ящик чужого РП»)'
    executor: 'script:scripts/wp-inbox.sh add --to WP-{n}'
    # проверка «уже доставлено» и запись идут под одной блокировкой (в пределах одной копии репозитория)
    semantics: atomic-dedup
    accepts: выжимка одной строкой, указатель на полный текст и откуда пришло
    who_may_write: любая сессия этого IWE
    status: exists

  - kind: agent
    title: ИИ-агент — очередь задач агентов
    delivery: internal
    name_pattern: '^agent$'
    address: 'path:{governance_repo}/inbox/agent/tasks/'
    executor: 'external:файл задачи в очереди; запускает диспетчер задач агентов (DP.SC.135), Почтальон только кладёт задачу'
    semantics: none
    accepts: задача с полями id, kind, agent, due, текстом поручения и критерием приёмки
    who_may_write: любая сессия этого IWE
    # Целевой (РП-418 Ф10, 23.11.2026): очередь сейчас никто не разбирает — диспетчер задач
    # агентов (iwe-agent-dispatcher.py, РП-324) ни на одной машине не запускается по расписанию,
    # последний результат — июнь 2026. Доставка сюда была бы доставкой в никуда.
    status: target

  - kind: owner
    title: владелец этого IWE — сообщение через Вестника
    delivery: external
    name_pattern: '^owner$'
    address: 'store:база Вестника — связка «чат — учётная запись» и настройки каналов владельца'
    executor: 'external:инструмент MCP send_telegram_message до приёмки Центра уведомлений (РП-568), затем приём выпуска Вестником'
    semantics: dedup-journal
    accepts: выпуск — вид и данные; слать ли, когда и в какой канал, решает Вестник
    who_may_write: проверенный отправитель с ключом (Хранитель отправителей Вестника)
    status: exists
