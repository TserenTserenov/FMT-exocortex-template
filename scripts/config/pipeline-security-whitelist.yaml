# pipeline-security-whitelist.yaml — запрещённые headless-вызовы для Executor-роли (WP-503 Ф9)
#
# АрхГейт Ф5 NBR №3 (2026-07-27): headless-конвейер не должен повторять
# инцидент WP-7 (23.07) — вызов `mcp__ext-railway__list_variables` без
# аргумента-фильтра напечатал ~90 боевых переменных (ANTHROPIC_API_KEY,
# Neon-пароли, GITHUB_BOT_PAT, ...) в транскрипт headless-сессии.
#
# Формат: список паттернов для флага --disallowedTools (claude CLI). Каждый
# паттерн — точное имя MCP-инструмента или Bash(команда-паттерн), синтаксис
# идентичен --allowedTools/--disallowedTools самого CLI.
#
# Расширение: добавить новую строку сюда, код не трогать — диспетчер читает
# файл каждый раз перед стартом headless-процесса, не кэширует список.
# Файл — обязательная часть поставки. Отсутствующий, пустой или невалидный
# список блокирует запуск Claude Executor (fail-closed) и пишет ERROR.
disallowed_tools:
  # Широкие read-all без фильтра — тот самый инцидент.
  - "mcp__ext-railway__list_variables"
  # Прямой доступ к секретам через shell — headless-исполнитель не должен
  # читать секрет-файлы напрямую, только через уже проверенные lib/telegram.sh
  # и подобные обёртки с mask_pii().
  - "Bash(cat ~/.secrets/*)"
  - "Bash(cat ~/.env*)"
  - "Bash(env)"
  # git push --force / reset --hard — headless-исполнитель не должен иметь
  # прав на разрушительные git-операции без явного разрешения пилота (AR.*
  # правила уже это регулируют для интерактивной сессии; здесь — тот же
  # инвариант для headless, механически, не полагаясь на прочтение текста).
  - "Bash(git push --force*)"
  - "Bash(git reset --hard*)"
