# pipeline-security-whitelist.yaml — forbidden headless calls for the Executor role (WP-503 Phase 9)
#
# ArchGate Phase 5 NBR №3 (2026-07-27): the headless pipeline must not repeat
# the WP-7 incident (23.07) — a call to `mcp__ext-railway__list_variables` without
# a filter argument printed ~90 production variables (ANTHROPIC_API_KEY,
# Neon passwords, GITHUB_BOT_PAT, ...) into the headless session transcript.
#
# Format: a list of patterns for the --disallowedTools flag (claude CLI). Each
# pattern is an exact MCP tool name or Bash(command-pattern), the syntax is
# identical to the CLI's own --allowedTools/--disallowedTools.
#
# Extension: add a new line here, do not touch the code — the dispatcher reads
# the file every time before starting a headless process, does not cache the list.
# The file is a mandatory part of the delivery. A missing, empty or invalid
# list blocks the launch of Claude Executor (fail-closed) and writes ERROR.
disallowed_tools:
  # Broad read-all without a filter — that very incident.
  - "mcp__ext-railway__list_variables"
  # Direct access to secrets via shell — a headless executor must not
  # read secret files directly, only through the already verified lib/telegram.sh
  # and similar wrappers with mask_pii().
  - "Bash(cat ~/.secrets/*)"
  - "Bash(cat ~/.env*)"
  - "Bash(env)"
  # git push --force / reset --hard — a headless executor must not have
  # rights to destructive git operations without the pilot's explicit permission (AR.*
  # rules already regulate this for an interactive session; here — the same
  # invariant for headless, mechanically, not relying on reading the text).
  - "Bash(git push --force*)"
  - "Bash(git reset --hard*)"
