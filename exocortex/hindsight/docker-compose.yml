version: "3.8"

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: iwe-hindsight
    ports:
      - "8888:8888"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HINDSIGHT_API_LLM_API_KEY=${OPENAI_API_KEY}
      - HINDSIGHT_PORT=8888
    volumes:
      - hindsight-data:/data
    restart: unless-stopped
    healthcheck:
      # ghcr.io/vectorize-io/hindsight:latest carries curl, not wget — the
      # wget probe always failed inside the container (executable not found),
      # so `docker ps` showed "unhealthy" for a live, healthy service (found
      # peer-session 2026-08-03-03-wp149-hindsight-fixes).
      test: ["CMD", "curl", "-sf", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  hindsight-data:
