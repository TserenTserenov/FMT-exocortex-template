# Runtime Overlay Registry — architecture F (Generated runtime, WP-273 Stage 2)
#
# Source-of-truth: this file in IWE (immutable).
# Output: $WORKSPACE_DIR/.iwe-runtime/ — is regenerated build-runtime.sh idempotent'ly.
#
# CONTRACT:
#   1. FMT remains clean upstream (git pull-able, no substituted values).
#   2. .exocortex.env = the single source user-defined values.
#   3. .iwe-runtime/ regenerable: deleted → setup.sh / update.sh / build-runtime.sh
#      will recreate identical, without data loss.
#
# When to add a file here:
#   - The file contains at least one {{PLACEHOLDER}} OR
#   - The file must live in $WORKSPACE_DIR/, not in FMT (BUG-1 class).
#
# When NOT to add:
#   - Read-only code (skills, hooks, lib, scripts/*.sh without placeholders) — read from FMT
#     via $IWE_TEMPLATE / $IWE_SCRIPTS.
#   - Documentation (README.md, *.md in docs/, prompts/) — read-only from FMT.

version: 1

# === SUBSTITUTED: FMT → .iwe-runtime/<path> with placeholder substitution ===
# Executable files and launchd-plists, that require absolute paths.
substituted:
  # Strategist (strategy sessions, planning)
  - roles/strategist/scripts/launchd/com.strategist.morning.plist
  - roles/strategist/scripts/launchd/com.strategist.weekreview.plist
  # issue #319: symmetric Linux units, launchd/*.plist macOS-only until now
  - roles/strategist/scripts/systemd/iwe-strategist-morning.service
  - roles/strategist/scripts/systemd/iwe-strategist-morning.timer
  - roles/strategist/scripts/systemd/iwe-strategist-weekreview.service
  - roles/strategist/scripts/systemd/iwe-strategist-weekreview.timer
  - roles/strategist/scripts/strategist.sh

  # Extractor (knowledge extraction)
  - roles/extractor/scripts/launchd/com.extractor.inbox-check.plist
  - roles/extractor/scripts/systemd/iwe-extractor-inbox-check.service
  - roles/extractor/scripts/systemd/iwe-extractor-inbox-check.timer
  - roles/extractor/scripts/extractor.sh
  # Runtime dependency of extractor.sh; included in the same build hash.
  - roles/extractor/scripts/wp429-extractor-prefilters.py
  - roles/extractor/config/routing.md

  # Synchronizer (background synchronization, scheduler)
  - roles/synchronizer/scripts/launchd/com.exocortex.scheduler.plist
  - roles/synchronizer/scripts/systemd/iwe-exocortex-scheduler.service
  - roles/synchronizer/scripts/systemd/iwe-exocortex-scheduler.timer
  - roles/synchronizer/scripts/scheduler.sh
  - roles/synchronizer/scripts/code-scan.sh
  - roles/synchronizer/scripts/daily-report.sh
  - roles/synchronizer/scripts/dt-collect.sh
  - roles/synchronizer/scripts/video-scan.sh
  - roles/synchronizer/scripts/templates/extractor.sh
  - roles/synchronizer/scripts/templates/strategist.sh
  - roles/synchronizer/scripts/templates/synchronizer.sh
  - roles/synchronizer/config.yaml

# === COPIED_TO_WORKSPACE: FMT → $WORKSPACE_DIR/<path> (without substitution) ===
# Files, that scripts look for in $WORKSPACE_DIR/ (BUG-1 fix). Without substitution
# are simply copied. On update.sh — are re-copied if changed in FMT,
# EXCEPT files from is_protected_user_file() (build-runtime.sh) — those are seeded
# only when absent, the existing user copy is not touched
# (issue #327: params.yaml was overwritten on every update.sh).
copied_to_workspace:
  - .claude/sync-manifest.yaml
  - params.yaml

# === COPIED_SUBSTITUTED: FMT → $WORKSPACE_DIR/<path> with substitution ===
# Files, that must be in $WORKSPACE_DIR/ with substituted placeholders.
# CLAUDE.md has special logic (3-way merge), does not go through build-runtime.
copied_substituted:
  # CLAUDE.md is processed separately via 3-way merge in setup.sh / update.sh,
  # NOT via build-runtime.sh. Preservation USER-SPACE / merge-conflicts is critical.

# === PLACEHOLDERS: keys, read from .exocortex.env ===
# All values are taken from $WORKSPACE_DIR/.exocortex.env (after WP-273 Phase19,
# previously — from $TEMPLATE_DIR/.exocortex.env, migration on first build).
placeholders:
  - HOME_DIR
  - USER_NAME
  - WORKSPACE_DIR
  - CLAUDE_PATH
  - CLAUDE_PROJECT_SLUG
  - TIMEZONE_HOUR
  - TIMEZONE_DESC
  - GITHUB_USER
  - GOVERNANCE_REPO   # launchd env var is named IWE_GOVERNANCE_REPO — same
                      # value, deliberately different key name, not a separate
                      # placeholder (peer-session 2026-09-08-32)
  - IWE_TEMPLATE      # path to FMT (read-only upstream)
  - IWE_RUNTIME       # path to $WORKSPACE_DIR/.iwe-runtime/ (writable substituted)
  - IWE_SCRIPTS       # $IWE_TEMPLATE/scripts — shared scripts read-only from FMT
                      # (peer-session 2026-09-08-32: missing here meant no
                      # generated plist could ever carry it, so the launchd
                      # jobs silently ran without it — issue found via Evgenii)

# === Runtime layout (what appears in $WORKSPACE_DIR/ after build-runtime.sh) ===
#
# $WORKSPACE_DIR/
#   ├── .exocortex.env                            ← user state (writable)
#   ├── .iwe-runtime/                             ← derived (regenerable)
#   │   ├── .build-hash                           ← stamp for drift detection
#   │   ├── .build-version                        ← FMT version + overlay version
#   │   ├── roles/strategist/scripts/...
#   │   ├── roles/extractor/scripts/...
#   │   └── roles/synchronizer/...
#   ├── .claude/sync-manifest.yaml                ← copied (not substituted)
#   ├── params.yaml                               ← copied (not substituted)
#   ├── CLAUDE.md                                 ← 3-way merge (separate logic)
#   └── ... (governance repos, personal repos)
