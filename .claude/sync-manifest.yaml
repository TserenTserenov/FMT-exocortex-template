# .claude/sync-manifest.yaml — registry of "source → derived" pairs for iwe-drift.sh
#
# The manifest is a registry of pairs for DETECTION, not for execution.
# The detector (`scripts/iwe-drift.sh`) emits a report; the operator (template-sync, update.sh,
# own scripts) applies the fix separately. Role separation: R23 detector ≠ R8 operator.
#
# Pair entry format:
#   id:              unique kebab-case
#   source:          path (absolute or relative to $IWE_ROOT)
#   derived:         path (same)
#   relation:        replication | projection | reference | reconciliation
#   check:           mtime-lag | content-diff | script:<path>
#   threshold_days:  lag before warn
#   critical_days:   lag before critical
#   owner_role:      R1 | R5 | R8 | human | agent
#   symptom:         how the user will notice it if missed
#   notes:           optional
#
# activity_check format (decommission triage in Month Close):
#   id:                     unique kebab-case
#   action:                 human-readable name
#   expected_per_period:    expected number of executions
#   period_days:            window size
#   commit_pattern_regex:   how to recognize an execution in git log / mtime
#   dormant_after_periods:  empty windows → dormant
#   archive_after_periods:  empty windows in dormant → archived

version: 1

pairs:

  # 1. Protocols (memory/) ↔ skills (.claude/skills/) — the implementation must follow the description
  - id: protocols-to-skills
    source: memory/protocol-close.md
    derived: .claude/skills/day-close/
    relation: reference
    check: mtime-lag
    threshold_days: 3
    critical_days: 10
    owner_role: agent
    symptom: "Скилл выполняет протокол не так, как описано в memory/protocol-close.md"

  - id: protocol-open-to-day-open-skill
    source: memory/protocol-open.md
    derived: .claude/skills/day-open/
    relation: reference
    check: mtime-lag
    threshold_days: 3
    critical_days: 10
    owner_role: agent
    symptom: "Day Open работает не по protocol-open.md"

  # 2. (issue #404) the staging-validated-to-fmt pair was removed from here 2026-08-12:
  #    its source (STAGING.md) is the author's trial infrastructure (CLAUDE.md §8),
  #    not shipped with the user installation of the template. The pair unconditionally
  #    got status=missing (mtime-lag does not distinguish "the source does not exist and
  #    never will" from "the source really disappeared") on every non-author installation
  #    forever — not an intentional delay. For the author who maintains STAGING.md,
  #    equivalent tracking goes through their own `author_mode` manifest,
  #    not the shared shipped file.

  # 3. ARCH anchor ↔ downstream `derived_from:` (helper from scripts/iwe-drift-helpers/)
  - id: arch-version-drift
    source: <Pack-репо>/02-domain-entities/
    derived: <Pack-репо>/
    relation: reference
    check: script:scripts/iwe-drift-helpers/check-arch-version.sh
    threshold_days: 7
    critical_days: 21
    owner_role: R1
    symptom: "ARCH-документ обновлён (bump version), но downstream-документы с `derived_from: <ID>@vX.Y` не пересмотрены"
    notes: "Helper извлекает `version:` из ARCH-frontmatter и ищет несовпадения в downstream `derived_from:` якорях. Требует явных `version: vX.Y` в frontmatter каждого ARCH-документа. Если у вас нет ARCH-документов с derived_from-якорями — пара бесполезна, удалите."

  # 4. WP-status legend (REGISTRY) ↔ format-compliance tables (helper from scripts/iwe-drift-helpers/)
  - id: wp-status-legend-drift
    source: <Governance-репо>/docs/WP-REGISTRY.md
    derived: <Governance-репо>/docs/WP-REGISTRY.md
    relation: reconciliation
    check: script:scripts/iwe-drift-helpers/check-status-legend.sh
    threshold_days: 7
    critical_days: 14
    owner_role: R1
    symptom: "Скрипты-потребители (linear-sync, day-close) перестают сходиться с реестром: новый статус-эмодзи не задокументирован в легенде, или active-id строка имеет terminal-status (или наоборот)"
    notes: "Helper проверяет 3 invariant: I1 legend completeness, I2/I3 format compliance (id-format ↔ status). Терминальные статусы захардкожены в helper'е (✅ 📦 ↗️) — список короче и стабильнее, чем active. Любой новый статус по умолчанию active. Адаптируйте путь REGISTRY под свою структуру (env REGISTRY=...)."

# ---------------------------------------------------------------------------
# Templates for your own pairs. Uncomment and adapt to your repo set.
# ---------------------------------------------------------------------------
#
#   # Pack ↔ DS (domain knowledge → implementation repos)
#   - id: pack-to-ds-instrument
#     source: <Pack-repo>/
#     derived: <DS-instrument-repo>/
#     relation: reference
#     check: mtime-lag
#     threshold_days: 7
#     critical_days: 21
#     owner_role: R1
#     symptom: "DS uses outdated terms/SC from Pack"
#
#   # Root CLAUDE.md ↔ CLAUDE.md of a DS repo (replica of platform rules)
#   - id: root-claude-md-to-instrument
#     source: CLAUDE.md
#     derived: <DS-instrument-repo>/CLAUDE.md
#     relation: replication
#     check: mtime-lag
#     threshold_days: 7
#     critical_days: 14
#     owner_role: agent
#     symptom: "DS repo does not know about new rules from the root CLAUDE.md"
#
#   # docs/ ↔ code in a DS-instrument repo
#   - id: instrument-docs-to-code
#     source: <DS-instrument-repo>/
#     derived: <DS-instrument-repo>/docs/
#     relation: reference
#     check: mtime-lag
#     threshold_days: 7
#     critical_days: 21
#     owner_role: agent
#     symptom: "docs/ lags behind code by more than 1 week"

# ---------------------------------------------------------------------------
# activity_checks — decommissioning of dead T-actions.
# The drift script proposes candidates, the R-questionnaire of Month Close (M6) collects the decision,
# a human confirms (active → dormant → archived).
# ---------------------------------------------------------------------------

activity_checks:

  - id: lesson-hygiene
    action: "Lesson Hygiene (ротация, архивация, сжатие MEMORY.md)"
    expected_per_period: 1
    period_days: 7
    commit_pattern_regex: "([Ll]esson|[Mm]emory|lessons_|[Уу]рок|[Пп]амят).*(archive|rotate|clean|hygiene|[Аа]рхив|[Рр]отаци|[Сс]жат|[Оо]чист|[Гг]игиен)"
    dormant_after_periods: 3
    archive_after_periods: 1
    notes: "Trigger: /week-close. Симптом мёртвости — MEMORY.md раздувается >100 строк."

  # staging-promotion removed (issue #1098): same class as staging-validated-to-fmt
  # (#404) — source (STAGING.md, /author-mode) is author-only, author_mode: false
  # installs never produce this commit pattern, so the detector reported a
  # permanent false "dormant" candidate on every user install.
