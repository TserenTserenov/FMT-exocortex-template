name: Release

# WP-529 Ф268 (24.11.2026): release from the release branch, main never stops.
#
# The release tag vX.Y.Z goes on the checked candidate itself — the commit of the
# highest vX.Y.Z-rc.N on release/vX.Y.Z — not on a merge commit in main. The release PR
# (release/vX.Y.Z -> main, opened at cut) is merged AFTER the release and brings the
# version, the CHANGELOG section and the branch fixes back to main.
#
# Trigger: the Release Lead's decision, as a manual run with an explicit version:
#   gh workflow run release.yml --ref main -f version=X.Y.Z
# Before Ф268 the decision was the merge of the release PR, and Validate Template on the
# merge commit triggered this workflow (workflow_run). There is no merge before the
# release any more, and every rc commit gets a green Validate run long before the
# candidate is checked by testers and red team: an automatic trigger on that run would
# release every candidate unchecked. The run therefore stays manual, and the link to the
# check is kept by requiring a green Validate Template run (push or workflow_dispatch)
# on release/vX.Y.Z for exactly the candidate commit.
#
# Refusals (no tag, no release):
#   - no candidate vX.Y.Z-rc.N at all (WP-529 Ф240);
#   - the tip of release/vX.Y.Z is not the latest candidate (commits after the last rc
#     would reach main with the release PR as "released" without being checked);
#   - an explicit sha that is not the latest candidate's commit;
#   - the tree differs from the candidate's tree (WP-529 Ф239), or the manifest on the
#     candidate carries another version;
#   - no green Validate Template run for the candidate commit on the release branch.
# "Latest" mark: only when vX.Y.Z is the highest stable version among all release tags,
# so a fix release of an older line never sends update.sh users back (release channel
# reads releases/latest).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия выпуска X.Y.Z: метка встанет на последний кандидат vX.Y.Z-rc.N ветки release/vX.Y.Z"
        required: true
      sha:
        description: "Необязательно: полный SHA последнего кандидата для сверки (пусто — берётся по метке rc)"
        required: false
        default: ""

permissions:
  contents: write
  # Read the Validate Template runs of the candidate; dispatch the post-release audit.
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    env:
      VERSION: ${{ github.event.inputs.version }}
      EXPECTED_SHA: ${{ github.event.inputs.sha }}
      DISPATCH_REF: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history and tags: candidates, previous releases

      - name: Check the version and the dispatch ref
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version должна быть вида X.Y.Z, получено: '$VERSION'"
            exit 1
          fi
          # The workflow file of the dispatched ref runs: only protected refs may carry it.
          case "$DISPATCH_REF" in
            main|"release/v$VERSION") ;;
            *)
              echo "::error::Выпуск запускается с main или release/v$VERSION, получено: '$DISPATCH_REF'."
              exit 1
              ;;
          esac

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Метка v$VERSION уже есть — выпуск пропущен."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the latest release candidate (WP-529 Ф239, Ф240, Ф268)
        id: rc
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          BRANCH="release/v$VERSION"
          if ! git fetch -q --tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            echo "::error::Ветки $BRANCH нет. Выпуск идёт только с ветки выпуска: Release Candidate, режим cut."
            exit 1
          fi
          RC_LATEST=$(git tag -l "v${VERSION}-rc.*" | grep -E "^v${VERSION//./\\.}-rc\.[0-9]+$" | sort -V | tail -1 || true)
          if [ -z "$RC_LATEST" ]; then
            echo "::error::Для v$VERSION нет кандидата (метки v$VERSION-rc.N). Релиз остановлен: выпуск идёт только через проверенного кандидата — запустите Release Candidate в режиме next-rc на ветке выпуска."
            exit 1
          fi
          RC_COMMIT=$(git rev-parse "${RC_LATEST}^{commit}")
          BRANCH_TIP=$(git rev-parse "refs/remotes/origin/$BRANCH")
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$RC_COMMIT" ]; then
            echo "::error::Указанный коммит $EXPECTED_SHA — не последний кандидат $RC_LATEST ($RC_COMMIT). Релиз остановлен."
            exit 1
          fi
          if [ "$BRANCH_TIP" != "$RC_COMMIT" ]; then
            echo "::error::Вершина $BRANCH ($BRANCH_TIP) — не последний кандидат $RC_LATEST ($RC_COMMIT): на ветке есть непроверенные коммиты. Поставьте новый кандидат (next-rc) и проверьте его, либо уберите эти коммиты с ветки."
            exit 1
          fi
          git checkout -q --detach "$RC_COMMIT"
          RC_TREE=$(git rev-parse "${RC_LATEST}^{tree}")
          HEAD_TREE=$(git rev-parse "HEAD^{tree}")
          echo "rc=$RC_LATEST rc_commit=$RC_COMMIT rc_tree=$RC_TREE head_tree=$HEAD_TREE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC_TREE" != "$HEAD_TREE" ]; then
            echo "::error::Дерево релиза v$VERSION ($HEAD_TREE) не совпадает с деревом кандидата $RC_LATEST ($RC_TREE). Релиз остановлен: кандидат проверялся не на этом содержимом — опубликуйте новый rc и проверьте заново."
            exit 1
          fi
          MANIFEST=$(grep -m1 '"version"' update-manifest.json \
            | sed 's/.*"version"[[:space:]]*:[[:space:]]*"//;s/".*//')
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::На кандидате $RC_LATEST в update-manifest.json версия '$MANIFEST', а выпускается $VERSION. Релиз остановлен."
            exit 1
          fi
          echo "rc_tag=$RC_LATEST" >> "$GITHUB_OUTPUT"
          echo "rc_commit=$RC_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Выпускается кандидат $RC_LATEST ($RC_COMMIT)."

      - name: Check that Validate Template passed on the candidate commit
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ steps.rc.outputs.rc_tag }}
          RC_COMMIT: ${{ steps.rc.outputs.rc_commit }}
        run: |
          RUNS=$(gh api "repos/$REPO/actions/workflows/validate-template.yml/runs?head_sha=$RC_COMMIT&per_page=100")
          GREEN=$(printf '%s' "$RUNS" | jq --arg branch "release/v$VERSION" \
            '[.workflow_runs[] | select(.head_branch == $branch and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length')
          if [ "$GREEN" -eq 0 ]; then
            echo "::error::Для кандидата $RC_TAG ($RC_COMMIT) нет успешной проверки Validate Template на ветке release/v$VERSION. Запустите её: gh workflow run validate-template.yml --ref release/v$VERSION — и повторите выпуск после зелёного результата."
            exit 1
          fi
          echo "Validate Template на $RC_COMMIT: успешных запусков — $GREEN."

      - name: Extract CHANGELOG section for this version
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          # Extract the block between "## [$VERSION]" and the next "## [" header.
          BODY=$(awk -v ver="$VERSION" 'index($0, "## [" ver "]") == 1 {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release $VERSION — see CHANGELOG.md for details."
          fi
          # Write to a file to preserve newlines through GitHub Actions output.
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/release_body.md"
          echo "Release notes extracted for $VERSION"

      - name: Decide the latest mark
        id: latest
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          HIGHEST=$( { git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
                       echo "v$VERSION"; } | sort -V | tail -1)
          if [ "$HIGHEST" = "v$VERSION" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION — наибольшая версия: выпуск получит пометку «последний»."
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION ниже уже выпущенной $HIGHEST: пометка «последний» остаётся у $HIGHEST."
          fi

      - name: Create tag and GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ steps.rc.outputs.rc_tag }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (candidate $RC_TAG)" HEAD
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" \
            --verify-tag \
            --title "IWE Template $TAG" \
            --notes-file "$RUNNER_TEMP/release_body.md" \
            --latest="$LATEST"
          echo "Created release $TAG on $(git rev-parse HEAD) (latest=$LATEST)"

      # A tag pushed with GITHUB_TOKEN starts no workflow; workflow_dispatch is the exception.
      # The audit reminder is automatic for x.y.0 only, as before (post-release-audit.yml).
      - name: Request the post-release audit (x.y.0)
        if: steps.tag_check.outputs.exists == 'false' && endsWith(github.event.inputs.version, '.0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh workflow run post-release-audit.yml --ref main -f version="$VERSION"; then
            echo "::warning::Напоминание об аудите для v$VERSION не запрошено — запустите post-release-audit.yml вручную."
          fi
