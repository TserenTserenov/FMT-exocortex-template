name: Release

# Triggered by Validate Template finishing green on main: if the manifest
# version at the validated commit is new (no matching tag), create a git tag
# v{version} and a GitHub release using the matching CHANGELOG section.
#
# WP-7 Ф62 (10.08.2026): previously triggered directly on `push:
# paths:[update-manifest.json]`, independent of CI — a release could ship
# while CI was still running or had already failed. Switched to workflow_run
# so a release only happens after Validate Template reports success FOR THAT
# EXACT COMMIT (github.event.workflow_run.head_sha) — no polling, no manual
# SHA matching, the link comes straight from the triggering event.
#
# Manual trigger: workflow_dispatch with explicit version input lets maintainers
# re-tag or create a release for an already-pushed version.

on:
  workflow_run:
    workflows: ["Validate Template"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.35.5). Leave empty to read from manifest."
        required: false
        default: ""
      sha:
        description: "Commit to tag (the validated bump commit). Leave empty to tag the dispatch ref tip."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # workflow_run fires for EVERY completed run of Validate Template
    # (push, pull_request, schedule, workflow_dispatch) — gate on conclusion
    # and on it being either a push or an explicit workflow_dispatch (the
    # only way weekly-release.yml's bot-commit gets validated at all, since
    # GitHub's anti-recursion policy blocks its own push from auto-triggering
    # Validate Template — see that workflow's `on:` comment). schedule/PR runs
    # never carry a version bump worth releasing; excluding them isn't a
    # safety measure, just avoids a pointless "tag already exists" no-op.
    if: >
      github.repository == 'TserenTserenov/FMT-exocortex-template' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run: pin to the exact commit Validate Template just
          # verified — this is what makes the gate actually mean something.
          # workflow_dispatch with explicit sha (weekly-release.yml closes the
          # chain this way): pin to that validated commit — a bare ref tip
          # could have moved past what Validate saw.
          # workflow_dispatch without sha (manual override): github.sha is the
          # ref that was dispatched against, same as before this change.
          ref: ${{ github.event.inputs.sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
          fetch-depth: 0  # full history to check existing tags

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep -m1 '"version"' update-manifest.json \
              | sed 's/.*"version"[[:space:]]*:[[:space:]]*"//;s/".*//')
          fi
          if [ -z "$VERSION" ]; then
            echo "FAIL: could not determine version from manifest"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section for this version
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the block between "## [$VERSION]" and the next "## [" header.
          BODY=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release $VERSION — see CHANGELOG.md for details."
          fi
          # Write to a file to preserve newlines through GitHub Actions output.
          echo "$BODY" > /tmp/release_body.md
          echo "Release notes extracted for $VERSION"

      - name: Create tag and GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "IWE Template $TAG" \
            --notes-file /tmp/release_body.md \
            --latest
          echo "Created release $TAG"
