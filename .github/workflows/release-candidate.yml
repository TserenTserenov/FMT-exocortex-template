name: Release Candidate

# WP-529 Ф251 (10.11.2026): manual-only path to a release candidate.
#
# The weekly scheduled release was cancelled by the owner on 03.11.2026 (its
# workflow was disabled manually, which also disabled the only place that
# created rc tags). A release is now cut when the Release Lead says "cut":
#
#   mode=cut      — take the main commit named by the Release Lead (snapshot),
#                   bump the version, flush [Unreleased] into the new section,
#                   push branch release/vX.Y.Z and open the release PR. No tag
#                   yet: the Developer first adds the handoff fields to the
#                   accumulated entries on this branch (WP-529 Ф252), so the
#                   snapshot does not move. The snapshot is explicit, not "tip
#                   of main at run time": main may move between the decision
#                   and the run.
#   mode=next-rc  — tag the branch tip as the next vX.Y.Z-rc.N (rc.1 included),
#                   after deferred changes were reverted or fields/fixes added.
#                   Every entry of the version section must carry its four
#                   fields (scripts/check-changelog-fields.py), otherwise no tag.
#                   Testers install exactly that tag (IWE_UPDATE_CHANNEL=rc). A
#                   tip whose tree equals the latest rc is refused: it would be
#                   the same candidate under a new name.
#
# No schedule: re-enabling a schedule would bring back the cancelled weekly
# cadence. Releasing the merged PR stays with release.yml, which refuses a
# release whose tree differs from the latest rc.
#
# PR merge mechanics are unchanged from the weekly workflow: a PR opened via
# GITHUB_TOKEN waits for "Approve workflows to run"; the owner merges only
# after Validate Template (release-receipt) passes on the PR commit.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'cut — новая ветка выпуска и PR (без метки); next-rc — метка кандидата rc.N на ветке выпуска'
        required: true
        type: choice
        options: [cut, next-rc]
        default: cut
      snapshot_sha:
        description: 'cut: коммит основной ветки, от которого режем выпуск (полный SHA)'
        required: false
        default: ''
      release_type:
        description: 'cut: patch — исправления, minor — новая функция'
        required: false
        type: choice
        options: [patch, minor]
        default: minor
      version:
        description: 'next-rc: версия выпуска, например 0.42.0 (ветка release/v<version>)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  cut:
    if: github.repository == 'TserenTserenov/FMT-exocortex-template' && github.event.inputs.mode == 'cut'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check the snapshot commit
        env:
          SNAPSHOT: ${{ github.event.inputs.snapshot_sha }}
        run: |
          if [[ ! "$SNAPSHOT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::snapshot_sha должен быть полным SHA коммита основной ветки (40 символов), получено: '$SNAPSHOT'"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$SNAPSHOT" origin/main; then
            echo "::error::Коммит $SNAPSHOT не входит в основную ветку — выпуск режется только от main."
            exit 1
          fi
          # WP-529 Ф261 (finding 2): the snapshot must be the tip of main right now. A
          # snapshot behind the tip means main already moved: merging the release PR would
          # add those commits, the tree would differ from the candidate and release.yml
          # would stop the release at the end. Name the current tip and cut again.
          MAIN_TIP=$(git rev-parse origin/main)
          if [ "$SNAPSHOT" != "$MAIN_TIP" ]; then
            echo "::error::Снимок $SNAPSHOT — не вершина основной ветки (сейчас $MAIN_TIP): основная ветка сдвинулась. Назовите актуальную вершину и повторите нарезку."
            exit 1
          fi
          git checkout --detach "$SNAPSHOT"

      - name: Check that Unreleased has content
        run: |
          BODY=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          if [ -z "$(echo "$BODY" | sed '/^\s*$/d')" ]; then
            echo "::error::[Unreleased] в CHANGELOG.md на снимке пуст — выпускать нечего."
            exit 1
          fi

      - name: Bump selected version in manifest
        id: bump
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          CURRENT=$(grep -m1 '"version"' update-manifest.json \
            | sed 's/.*"version"[[:space:]]*:[[:space:]]*"//;s/".*//')
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid manifest version: $CURRENT" >&2
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$RELEASE_TYPE" in
            patch) NEW="$MAJOR.$MINOR.$((10#$PATCH + 1))" ;;
            minor) NEW="$MAJOR.$((10#$MINOR + 1)).0" ;;
            *) echo "Unsupported release_type: $RELEASE_TYPE" >&2; exit 1 ;;
          esac
          if git ls-remote --exit-code --heads origin "release/v$NEW" >/dev/null; then
            echo "::error::Ветка release/v$NEW уже есть. Следующий кандидат на ней — режим next-rc с version=$NEW."
            exit 1
          fi
          python3 - "$NEW" <<'EOF'
          import json, sys
          with open('update-manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          m['version'] = sys.argv[1]
          with open('update-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
              f.write('\n')
          EOF
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Version bumped ($RELEASE_TYPE): $CURRENT -> $NEW"

      - name: Flush Unreleased section to new version
        run: bash scripts/changelog-flush.sh --version "${{ steps.bump.outputs.version }}"

      # The bump commit must carry the README badge and a manifest rebuilt
      # after the flush, or Validate Template fails on it (WP-529, 20.08).
      - name: Sync version badge and rebuild manifest for the bump commit
        run: |
          bash scripts/sync-version-badge.sh --fix
          bash generate-manifest.sh

      - name: Commit to the release branch
        id: commit
        run: |
          BRANCH="release/v${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add update-manifest.json CHANGELOG.md README.md
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} from snapshot ${{ github.event.inputs.snapshot_sha }}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Выпуск v${{ steps.bump.outputs.version }}, снимок основной ветки ${{ github.event.inputs.snapshot_sha }} (WP-529 Ф251)."
          BODY="$BODY"$'\n\n'"Метки кандидата ещё нет. На этой ветке: дописать четыре поля всем записям раздела [${{ steps.bump.outputs.version }}] (python3 scripts/check-changelog-fields.py --section ${{ steps.bump.outputs.version }}), отложенное снять откатом (git revert). Затем Release Candidate в режиме next-rc ставит rc.1."
          BODY="$BODY"$'\n'"Основную ветку до слияния этого PR не двигать. Если она всё же сдвинулась, Release Candidate (next-rc) откажет; порядок: влить main в эту ветку, затем next-rc, заново пройти строки протокола. Перед слиянием: bash scripts/check-release-branch-base.sh ${{ steps.bump.outputs.version }}."
          BODY="$BODY"$'\n'"Установка кандидата тестировщиком: IWE_UPDATE_CHANNEL=rc bash update.sh"
          BODY="$BODY"$'\n'"Слияние: одобрить запуск проверок (Approve workflows to run), дождаться Validate Template с release-receipt. Релиз остановится, если его дерево разойдётся с последним кандидатом."
          gh pr create \
            --title "chore(release): v${{ steps.bump.outputs.version }}" \
            --body "$BODY" \
            --base main \
            --head "${{ steps.commit.outputs.branch }}"

  next-rc:
    if: github.repository == 'TserenTserenov/FMT-exocortex-template' && github.event.inputs.mode == 'next-rc'
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.rc.outputs.rc_tag }}
    steps:
      - name: Check the version input
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version должна быть вида X.Y.Z, получено: '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/v${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Check the branch carries this version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          MANIFEST=$(grep -m1 '"version"' update-manifest.json \
            | sed 's/.*"version"[[:space:]]*:[[:space:]]*"//;s/".*//')
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::На ветке release/v$VERSION в update-manifest.json версия $MANIFEST — ветка не того выпуска."
            exit 1
          fi

      # WP-529 Ф261 (finding 2): a candidate is only meaningful while main is part of the
      # branch, otherwise merging the PR changes the tree and the release stops.
      - name: Check that main is part of the release branch
        run: bash scripts/check-release-branch-base.sh "${{ github.event.inputs.version }}" origin --head

      - name: Check handoff fields of the version section (WP-529 Ф252)
        run: python3 scripts/check-changelog-fields.py --ref HEAD --section "${{ github.event.inputs.version }}"

      - name: Tag the next release candidate
        id: rc
        run: bash scripts/tag-release-candidate.sh "${{ github.event.inputs.version }}" origin >> "$GITHUB_OUTPUT"

      - name: Note the candidate on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          PR=$(gh pr list --head "release/v$VERSION" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "::warning::Открытого PR для release/v$VERSION нет — кандидат ${{ steps.rc.outputs.rc_tag }} поставлен без комментария."
            exit 0
          fi
          gh pr comment "$PR" --body "Новый кандидат: ${{ steps.rc.outputs.rc_tag }}
          commit: ${{ steps.rc.outputs.rc_commit }}
          tree: ${{ steps.rc.outputs.rc_tree }}
          Проверку повторить на этом кандидате."

  # WP-529 Ф270, F3 of the v0.42.0-rc.4 red team: no check ran update.sh from the published
  # release to the candidate, so the path every user takes was proven only by hand. update.sh
  # downloads by tag, so this runs once the candidate tag is pushed. A failure here means the
  # candidate must not go to testers. Dispatch next-rc on the release branch
  # (gh workflow run release-candidate.yml --ref release/vX.Y.Z -f mode=next-rc -f version=X.Y.Z):
  # workflow_dispatch runs the workflow file of the ref it is dispatched on, and until this
  # release merges main has no copy of this job (F2 of the v0.42.0-rc.6 red team: dispatched
  # from main, the job never ran for rc.5 and rc.6).
  # WP-529 Ф270, row 3 of 0.42 rc.9: the upgrade from 0.36.3 (an install made by the old setup.sh,
  # still in use) failed while the latest-release path passed, and the macOS path was left to the
  # human tester. Every candidate now upgrades from both releases on Linux and on macOS; the macOS
  # runner is disposable, so the launchd jobs an upgrade may add touch nothing real.
  upgrade-from-release:
    needs: next-rc
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        prev: [latest, v0.36.3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.next-rc.outputs.rc_tag }}
          fetch-depth: 0
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3 jq
      # Same preparation as integration-contract-macos in validate-template.yml: jq is not on the
      # image and Homebrew's python3 is PEP 668-managed.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m pip install --user pyyaml 2>/dev/null && python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m pip install --user --break-system-packages pyyaml && python3 -c "import yaml"
      - name: Upgrade ${{ matrix.prev }} to the candidate with update.sh (${{ matrix.os }})
        env:
          # Four legs list tags at once: anonymous API calls hit the rate limit (403 on rc.10, macOS).
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # The image puts Homebrew bash 5 first; most Macs run the system /bin/bash 3.2, and
            # update.sh re-execs plain `bash`, so shadow it for the whole run.
            mkdir -p "$RUNNER_TEMP/system-bash"
            ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
            export PATH="$RUNNER_TEMP/system-bash:$PATH"
            bash --version | head -1
          fi
          PREV_TAG="${{ matrix.prev }}"
          if [ "$PREV_TAG" = latest ]; then
            PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-rc\.' | head -1)
          fi
          [ -n "$PREV_TAG" ] || { echo "::error::нет опубликованного выпуска v*"; exit 1; }
          bash setup/test-rc-upgrade-from-release.sh "${{ needs.next-rc.outputs.rc_tag }}" "$PREV_TAG" \
            "https://github.com/${{ github.repository }}.git"
