name: Notify Template Update

# Ежедневно в 7:28 MSK (4:28 UTC) проверяет коммиты за 24ч
# и отправляет анонс выпуска подписчикам через webhook бота @aist_me_bot.
# WP-529: текст анонса собирает и проверяет scripts/release-notice-build.py
# (модель → проверки → редактор → одна поправка → иначе короткий анонс).
# Готовый текст сохраняется артефактом и уходит предпросмотром автору;
# рассылка — отдельной задачей в окружении release-notice (там задаются
# задержка и право остановить рассылку). Ручной запуск по умолчанию — dry-run.

on:
  schedule:
    - cron: '28 4 * * *'  # 7:28 MSK
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только собрать анонс и показать артефакт, без предпросмотра и рассылки'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    outputs:
      ready: ${{ steps.notice.outputs.ready }}
      version: ${{ steps.notice.outputs.version }}
      notice_b64: ${{ steps.notice.outputs.notice_b64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # нужна полная история для git log

      - name: Check for recent commits
        id: check
        run: |
          COMMITS=$(git log --since="24 hours ago" --oneline 2>/dev/null)
          if [ -z "$COMMITS" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last 24 hours"
          else
            COMMIT_COUNT=$(echo "$COMMITS" | wc -l | tr -d ' ')
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
            echo "$COMMIT_COUNT commits found"
          fi

      - name: Extract changelog entries for recent dates
        if: steps.check.outputs.has_changes == 'true'
        id: changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "entry=Нет CHANGELOG.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Собираем ВСЕ версии за последние 24ч (сегодня + вчера)
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)

          # Первая (самая новая) РЕАЛЬНО ВЫПУЩЕННАЯ версия — для заголовка
          # (см. блок ниже: заголовок тоже не имеет права опережать тег).
          VERSION=""

          # 2026-08-22 (live: анонс v0.38.7 ушёл 32 подписчикам, пока тега и
          # GitHub Release не существовало): дайджест обязан опираться на факт
          # выпуска, не на заголовок CHANGELOG. Секции версий без существующего
          # git-тега (v<ver> или <ver>) исключаются из рассылки целиком.
          git tag > /tmp/existing_tags.txt
          while IFS= read -r hdr; do
            ver=$(printf '%s' "$hdr" | sed -E 's/^\[([^]]+)\].*/\1/')
            if grep -qx "v$ver" /tmp/existing_tags.txt || grep -qx "$ver" /tmp/existing_tags.txt; then
              VERSION="$hdr"
              break
            fi
          done < <(grep '^## \[' CHANGELOG.md | sed 's/## //')

          # Все записи с датами today или yesterday
          # Собираем все блоки между ## [...] заголовками, фильтруя по дате
          python3 -c "
          import sys
          today = '$TODAY'
          yesterday = '$YESTERDAY'
          entries = []
          current_block = []
          current_date = None
          tags = set(open('/tmp/existing_tags.txt').read().split())
          def released(ver):
              # Unreleased-секция и версии без тега не анонсируются;
              # исторические теги встречаются и с 'v', и без.
              if not ver or ver.lower() == 'unreleased':
                  return False
              return ('v' + ver) in tags or ver in tags
          current_ver = None
          with open('CHANGELOG.md') as f:
              for line in f:
                  if line.startswith('## ['):
                      if current_block and current_date in (today, yesterday) and released(current_ver):
                          entries.extend(current_block)
                      current_block = []
                      # Extract date from '## [0.8.7] — 2026-03-17'
                      parts = line.split('—')
                      current_date = parts[-1].strip() if len(parts) > 1 else ''
                      current_ver = line.split('[', 1)[-1].split(']', 1)[0].strip()
                  elif current_date is not None:
                      current_block.append(line)
              # Last block
              if current_block and current_date in (today, yesterday) and released(current_ver):
                  entries.extend(current_block)
          # Полный текст: обрыв на 50 строках выбрасывал пункты из анонса (WP-529).
          print(''.join(entries).strip())
          " > /tmp/changelog_entry.txt

          echo "$VERSION" > /tmp/changelog_version.txt

          # Проверяем, есть ли содержательные записи changelog за эти даты
          # Пустой файл или только пробелы/переводы строк = нет changelog
          if [ ! -s /tmp/changelog_entry.txt ]; then
            echo "No changelog entries for $TODAY or $YESTERDAY — skipping notification"
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          else
            # Проверяем, что changelog содержит хотя бы один буллет-пункт (- или *)
            # Без этого changelog может содержать только заголовки секций без пунктов
            if ! grep -qE '^\s*[-*]' /tmp/changelog_entry.txt; then
              echo "Changelog has no substantive entries (no bullet points) — skipping"
              echo "has_changelog=false" >> "$GITHUB_OUTPUT"
            else
              echo "has_changelog=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check significance of changes
        if: steps.check.outputs.has_changes == 'true' && steps.changelog.outputs.has_changelog == 'true'
        id: significance
        run: |
          # Проверяем, есть ли значимые изменения для пользователей
          # Незначительные: только CLAUDE.md, memory/, .claude/rules/, version bump, typo fix
          # Значимые: скиллы, роли, протоколы, install/update, docs, новые файлы

          CHANGELOG=$(cat /tmp/changelog_entry.txt)

          # Список файлов, изменённых за 24ч
          CHANGED_FILES=$(git log --since="24 hours ago" --name-only --pretty=format: | sort -u | grep -v '^$')

          # Паттерны значимых изменений (в changelog-тексте)
          SIGNIFICANT_PATTERNS="skill|роль|протокол|Added|Добавлено|install|update\.sh|setup|SETUP-GUIDE|LEARNING-PATH|скилл|новый|new"

          # Паттерны значимых файлов
          SIGNIFICANT_FILES="\.sh$|skills/|roles/|docs/|install|setup|synchronizer/"

          # Проверяем changelog на значимые ключевые слова
          if echo "$CHANGELOG" | grep -qiE "$SIGNIFICANT_PATTERNS"; then
            echo "is_significant=true" >> "$GITHUB_OUTPUT"
            echo "Significant: changelog contains notable changes"
            exit 0
          fi

          # Проверяем изменённые файлы на значимые паттерны
          if echo "$CHANGED_FILES" | grep -qE "$SIGNIFICANT_FILES"; then
            echo "is_significant=true" >> "$GITHUB_OUTPUT"
            echo "Significant: changed files include user-facing components"
            exit 0
          fi

          # Считаем буллет-пункты в changelog — если ≥3, считаем значимым (накопительный эффект)
          BULLET_COUNT=$(grep -cE '^\s*[-*]' /tmp/changelog_entry.txt || true)
          if [ "$BULLET_COUNT" -ge 3 ]; then
            echo "is_significant=true" >> "$GITHUB_OUTPUT"
            echo "Significant: $BULLET_COUNT changelog entries (cumulative)"
            exit 0
          fi

          echo "is_significant=false" >> "$GITHUB_OUTPUT"
          echo "Not significant: only minor/internal changes ($BULLET_COUNT entries, no significant patterns)"

      - name: Build release notice
        if: steps.check.outputs.has_changes == 'true' && steps.changelog.outputs.has_changelog == 'true' && steps.significance.outputs.is_significant == 'true'
        id: notice
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          VERSION=$(sed -E 's/^\[([^]]+)\].*/\1/' /tmp/changelog_version.txt)
          python3 scripts/release-notice-build.py --version "$VERSION" \
            --entries /tmp/changelog_entry.txt --out-dir release-notice
          cat release-notice/notice.html
          {
            echo "ready=true"
            echo "version=$VERSION"
            echo "notice_b64=$(base64 -w0 release-notice/notice.html)"
          } >> "$GITHUB_OUTPUT"

      - name: Save notice artifact
        if: steps.notice.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notice-${{ steps.notice.outputs.version }}
          path: release-notice/

      - name: Send preview to the author
        if: steps.notice.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)
        env:
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          TEMPLATE_WEBHOOK_SECRET: ${{ secrets.TEMPLATE_WEBHOOK_SECRET }}
        run: |
          jq -n --arg version "${{ steps.notice.outputs.version }}" --rawfile html release-notice/notice.html \
            '{version: $version, message_html: $html, preview: true}' > /tmp/preview.json
          curl -fsS -X POST "${BOT_WEBHOOK_URL}/api/template-update" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${TEMPLATE_WEBHOOK_SECRET}" \
            --data @/tmp/preview.json

  send:
    needs: build
    if: needs.build.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: release-notice
    steps:
      - name: Send notice via bot webhook
        env:
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          TEMPLATE_WEBHOOK_SECRET: ${{ secrets.TEMPLATE_WEBHOOK_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTICE_B64: ${{ needs.build.outputs.notice_b64 }}
        run: |
          printf '%s' "$NOTICE_B64" | base64 -d > /tmp/notice.html
          jq -n --arg version "$VERSION" --rawfile html /tmp/notice.html \
            '{version: $version, message_html: $html}' > /tmp/notice.json

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${BOT_WEBHOOK_URL}/api/template-update" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${TEMPLATE_WEBHOOK_SECRET}" \
            --data @/tmp/notice.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Bot webhook responded: $BODY"
          else
            echo "✗ Bot webhook failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
