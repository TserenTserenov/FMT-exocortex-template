name: Notify Template Update

# Daily at 7:28 MSK (4:28 UTC) checks release tags created in the last 24h
# and sends the release announcement to subscribers via the @aist_me_bot webhook.
# WP-529 Ф268: the version sections are read from CHANGELOG.md at the release tag
# (the release PR reaches main only after the release).
# WP-529: the announcement text is built and checked by scripts/release-notice-build.py
# (model → checks → editor → one correction → otherwise a short announcement).
# The ready text is saved as an artifact and goes to the author as a preview;
# the mailing is a separate job in the release-notice environment (the delay
# and the right to stop the mailing are set there). A manual run is dry-run by default.

on:
  schedule:
    - cron: '28 4 * * *'  # 7:28 MSK
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только собрать анонс и показать артефакт, без предпросмотра и рассылки'
        type: boolean
        default: true
      version:
        description: 'Версия выпуска, чей анонс собрать независимо от даты заголовка в CHANGELOG (например 0.42.0). Пусто — обычное окно «сегодня и вчера»'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    outputs:
      ready: ${{ steps.notice.outputs.ready }}
      version: ${{ steps.notice.outputs.version }}
      notice_b64: ${{ steps.notice.outputs.notice_b64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # the full history and the release tags are needed

      # WP-529 Ф268: a release is tagged on its release branch, and its release PR comes back to
      # main only later. So the announcement starts from the release tags created in the last
      # 24 hours (tag date, not the date in the CHANGELOG header, which is the cut day) and reads
      # each version section from CHANGELOG.md AT ITS TAG, not from main.
      - name: Find releases to announce
        id: check
        env:
          FORCE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$FORCE_VERSION" ]; then
            if ! printf '%s' "$FORCE_VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
              echo "::error::version must look like 0.42.0"
              exit 1
            fi
            # Historical tags exist both with and without the leading 'v'.
            if git rev-parse -q --verify "refs/tags/v$FORCE_VERSION" >/dev/null; then
              TAGS="v$FORCE_VERSION"
            elif git rev-parse -q --verify "refs/tags/$FORCE_VERSION" >/dev/null; then
              TAGS="$FORCE_VERSION"
            else
              echo "::error::Метки v$FORCE_VERSION нет — версия не выпущена, анонсировать нечего."
              exit 1
            fi
          else
            SINCE=$(( $(date -u +%s) - 86400 ))
            TAGS=$(git for-each-ref --format='%(refname:short) %(creatordate:unix)' 'refs/tags/v*' \
              | awk -v since="$SINCE" '$1 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $2 >= since {print $1}' \
              | sort -rV)
          fi
          if [ -z "$TAGS" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No release tags in the last 24 hours"
            exit 0
          fi
          printf '%s\n' "$TAGS" > /tmp/release_tags.txt
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Releases to announce: $(tr '\n' ' ' < /tmp/release_tags.txt)"

      - name: Extract changelog entries at the release tags
        if: steps.check.outputs.has_changes == 'true'
        id: changelog
        run: |
          : > /tmp/changelog_entry.txt
          : > /tmp/changelog_version.txt
          while IFS= read -r TAG; do
            VER="${TAG#v}"
            if ! git show "$TAG:CHANGELOG.md" > /tmp/changelog_at_tag.md 2>/dev/null; then
              echo "::warning::В метке $TAG нет CHANGELOG.md — версия пропущена."
              continue
            fi
            python3 - "$VER" /tmp/changelog_at_tag.md >> /tmp/changelog_entry.txt <<'PY'
          import sys
          ver, path = sys.argv[1], sys.argv[2]
          inside = False
          block = []
          with open(path, encoding='utf-8') as f:
              for line in f:
                  if line.startswith('## ['):
                      if inside:
                          break
                      inside = line.split('[', 1)[-1].split(']', 1)[0].strip() == ver
                      continue
                  if inside:
                      block.append(line)
          # Full text: cutting at 50 lines dropped items from the announcement (WP-529).
          text = ''.join(block).strip()
          if text:
              print(text)
          PY
            # The newest release names the announcement: "[X.Y.Z] — date" as in the header.
            if [ ! -s /tmp/changelog_version.txt ]; then
              grep -m1 "^## \[$VER\]" /tmp/changelog_at_tag.md | sed 's/## //' > /tmp/changelog_version.txt || true
            fi
          done < /tmp/release_tags.txt

          # Files of the announced releases: from the previous stable release to the newest tag.
          NEWEST=$(head -1 /tmp/release_tags.txt)
          OLDEST=$(tail -1 /tmp/release_tags.txt)
          PREV=$( { git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$OLDEST" || true
                    echo "$OLDEST"; } | sort -V | grep -B1 -xF "$OLDEST" | head -1)
          if [ -n "$PREV" ] && [ "$PREV" != "$OLDEST" ]; then
            git diff --name-only "$PREV" "$NEWEST" > /tmp/changed_files.txt
          else
            git show --name-only --pretty=format: "$NEWEST" > /tmp/changed_files.txt
          fi

          # Проверяем, есть ли содержательные записи changelog у этих выпусков
          # Пустой файл или только пробелы/переводы строк = нет changelog
          if [ ! -s /tmp/changelog_entry.txt ]; then
            echo "No changelog entries for $(tr '\n' ' ' < /tmp/release_tags.txt)— skipping notification"
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          else
            # Проверяем, что changelog содержит хотя бы один буллет-пункт (- или *)
            # Без этого changelog может содержать только заголовки секций без пунктов
            if ! grep -qE '^\s*[-*]' /tmp/changelog_entry.txt; then
              echo "Changelog has no substantive entries (no bullet points) — skipping"
              echo "has_changelog=false" >> "$GITHUB_OUTPUT"
            else
              echo "has_changelog=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check significance of changes
        if: steps.check.outputs.has_changes == 'true' && steps.changelog.outputs.has_changelog == 'true'
        id: significance
        run: |
          # Проверяем, есть ли значимые изменения для пользователей
          # Незначительные: только CLAUDE.md, memory/, .claude/rules/, version bump, typo fix
          # Значимые: скиллы, роли, протоколы, install/update, docs, новые файлы

          CHANGELOG=$(cat /tmp/changelog_entry.txt)

          # Список файлов выпуска (собран на предыдущем шаге по меткам, WP-529 Ф268)
          CHANGED_FILES=$(sort -u /tmp/changed_files.txt | grep -v '^$' || true)

          # Паттерны значимых изменений (в changelog-тексте)
          SIGNIFICANT_PATTERNS="skill|роль|протокол|Added|Добавлено|install|update\.sh|setup|SETUP-GUIDE|LEARNING-PATH|скилл|новый|new"

          # Паттерны значимых файлов
          SIGNIFICANT_FILES="\.sh$|skills/|roles/|docs/|install|setup|synchronizer/"

          # Проверяем changelog на значимые ключевые слова
          if echo "$CHANGELOG" | grep -qiE "$SIGNIFICANT_PATTERNS"; then
            echo "is_significant=true" >> "$GITHUB_OUTPUT"
            echo "Significant: changelog contains notable changes"
            exit 0
          fi

          # Проверяем изменённые файлы на значимые паттерны
          if echo "$CHANGED_FILES" | grep -qE "$SIGNIFICANT_FILES"; then
            echo "is_significant=true" >> "$GITHUB_OUTPUT"
            echo "Significant: changed files include user-facing components"
            exit 0
          fi

          # Считаем буллет-пункты в changelog — если ≥3, считаем значимым (накопительный эффект)
          BULLET_COUNT=$(grep -cE '^\s*[-*]' /tmp/changelog_entry.txt || true)
          if [ "$BULLET_COUNT" -ge 3 ]; then
            echo "is_significant=true" >> "$GITHUB_OUTPUT"
            echo "Significant: $BULLET_COUNT changelog entries (cumulative)"
            exit 0
          fi

          echo "is_significant=false" >> "$GITHUB_OUTPUT"
          echo "Not significant: only minor/internal changes ($BULLET_COUNT entries, no significant patterns)"

      - name: Build release notice
        if: steps.check.outputs.has_changes == 'true' && steps.changelog.outputs.has_changelog == 'true' && steps.significance.outputs.is_significant == 'true'
        id: notice
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          VERSION=$(sed -E 's/^\[([^]]+)\].*/\1/' /tmp/changelog_version.txt)
          python3 scripts/release-notice-build.py --version "$VERSION" \
            --entries /tmp/changelog_entry.txt --out-dir release-notice
          cat release-notice/notice.html
          {
            echo "ready=true"
            echo "version=$VERSION"
            echo "notice_b64=$(base64 -w0 release-notice/notice.html)"
          } >> "$GITHUB_OUTPUT"

      - name: Save notice artifact
        if: steps.notice.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notice-${{ steps.notice.outputs.version }}
          path: release-notice/

      - name: Send preview to the author
        if: steps.notice.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)
        env:
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          TEMPLATE_WEBHOOK_SECRET: ${{ secrets.TEMPLATE_WEBHOOK_SECRET }}
        run: |
          jq -n --arg version "${{ steps.notice.outputs.version }}" --rawfile html release-notice/notice.html \
            '{version: $version, message_html: $html, preview: true}' > /tmp/preview.json
          curl -fsS -X POST "${BOT_WEBHOOK_URL}/api/template-update" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${TEMPLATE_WEBHOOK_SECRET}" \
            --data @/tmp/preview.json

  send:
    needs: build
    if: needs.build.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: release-notice
    steps:
      - name: Send notice via bot webhook
        env:
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          TEMPLATE_WEBHOOK_SECRET: ${{ secrets.TEMPLATE_WEBHOOK_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTICE_B64: ${{ needs.build.outputs.notice_b64 }}
        run: |
          printf '%s' "$NOTICE_B64" | base64 -d > /tmp/notice.html
          jq -n --arg version "$VERSION" --rawfile html /tmp/notice.html \
            '{version: $version, message_html: $html}' > /tmp/notice.json

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${BOT_WEBHOOK_URL}/api/template-update" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${TEMPLATE_WEBHOOK_SECRET}" \
            --data @/tmp/notice.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Bot webhook responded: $BODY"
          else
            echo "✗ Bot webhook failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
