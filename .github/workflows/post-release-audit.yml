name: Post-Release Adversarial Audit

# see VR.SC.006 (release-verification-protocol), VR.M.006 (6 verification levels, layer 5)
# see AR.203 (release verification trigger)
#
# Triggers:
#   1. Manual: workflow_dispatch — the author runs it after a release.
#   2. Auto: push of update-manifest.json, BUT only when patch=0 (x.y.0 —
#      minor/major). Re-enabled 2026-08-10 (WP-7 Phase 62) after the unconditional
#      trigger on EVERY push (including the weekly auto-bump of the patch version)
#      was turned off on 2026-06-01: 22 issues piled up unread, because the frequency
#      itself (1-7 days) left no chance to work through them. The scheduled run
#      bumps patch — this filter keeps routine patch releases from creating
#      an issue, but catches any minor/major bump (they are always deliberate, not auto-cron).
#      A sensitive patch release gets the same venue via workflow_dispatch.
#
# Goal: create a reminder with an adversarial prompt → the author runs it in a Claude session
# → finds classes of regressions that detectors do not catch.
#
# One reminder per version: an issue that already exists with the same title (open OR closed) is not
# recreated by the step; it searches by the `release-audit` label and the exact title across all pages of the list (a removed label or
# a renamed issue allows re-creation). While only an open issue was caught, closing
# the issue after the audit led to the next push of update-manifest.json at the same version x.y.0
# (it stays until the next bump) creating it again: after #748 was closed, #783 appeared for v0.40.0, and it
# hung open.
#
# Notifying the author: only the issue itself (GitHub will send an email and a push). Previously, after creating the issue the step sent a
# reminder to the bot's `/api/template-update`. That is the same entry as the release mailing to subscribers: the service message
# "Independent check needed (red team)" went to all update subscribers (35 people at 0.41.0) under the title
# "IWE template update" and with the signature "1 commit(s) in the last 24h" (the number is hard-coded in the step). The bot has no addressed sending
# to the author alone: until it appears, do not bring the step back. When it appears, hook it up following the pattern of
# release-watchdog.yml (an optional step via vars.PILOT_NOTICE_ENDPOINT, recipient only the pilot).

on:
  push:
    branches: [main]
    paths:
      - update-manifest.json
  workflow_dispatch:
    inputs:
      version:
        description: 'Релизная версия для аудита (например 0.29.18)'
        required: true
        type: string

permissions:
  issues: write
  contents: read

jobs:
  create-audit-issue:
    runs-on: ubuntu-latest
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep -m1 '"version"' update-manifest.json \
              | sed 's/.*"version"[[:space:]]*:[[:space:]]*"//;s/".*//')
            echo "version=$VER" >> $GITHUB_OUTPUT
          fi
      - name: Skip routine patch bumps on auto-trigger (patch != 0)
        id: gate
        if: github.event_name != 'workflow_dispatch'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          if [ "$PATCH" != "0" ]; then
            echo "SKIP: $VERSION — patch-релиз (weekly auto-bump), не minor/major. Явный запуск доступен вручную."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update audit reminder issue
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        id: issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const version = '${{ steps.ver.outputs.version }}';
            const promptBody = fs.readFileSync('setup/release-audit-prompt.md', 'utf8');

            const title = `Post-release adversarial audit: v${version}`;
            const body = `> **Напоминание об аудите.** Для v${version} нужен adversarial audit субагентом или внешним пилотом.
            >
            > Цель: найти воспроизводимые классы регрессий, не охваченные текущими детекторами и проверками установки.
            >
            > **После audit — обновить \`docs/release-audit-log.md\`** (status + findings + result); закрыть это напоминание только после создания отдельных открытых задач для нерешённых существенных находок.

            ## Шаги (минимум ручной работы)

            1. Открой НОВЫЙ чат с агентом (не тот, где делались правки релиза) — независимость проверяющего от автора важна.
            2. Скажи одной фразой: «прогони red team проверку из задачи #<номер этой задачи> в FMT-exocortex-template». Агент сам откроет эту задачу, прочитает промпт ниже и выполнит его — копировать текст руками не нужно.
            3. Для каждой существенной подтверждённой находки укажи исполняемый detector, fixture или runtime-тест с красным контролем и зелёным кандидатом. Если проверки нет, оговорку должен явно принять владелец продукта или назначенный утверждающий выпуск, не автор находки. Укажи постоянную ссылку на решение в issue, PR или записи решения, область, причину и условие пересмотра. Без решения и ссылки оговорка только предложена, находка открыта. Для каждой нерешённой существенной находки создай отдельный открытый issue и приведи ссылку; это напоминание не является задачей с находкой.
            4. Оставь вывод слоя 5 комментарием: STABLE / X classes found со ссылками на проверки, оговорки и отдельные открытые задачи. После нужного вердикта слоя 6 и создания задач для всех нерешённых существенных находок закрой напоминание; его закрытие не закрывает находки.

            ## Слой 6 — независимая проверка платформы

            Если выпуск меняет обновлятор, безопасность или поведение агента, другой проверяющий (не автор изменений) проводит \`iwe-platform-redteam\` на одноразовых фикстурах и оставляет комментарий в этом issue:

            \`\`\`
            Слой 6: GO / CAUTION / BLOCKED
            Проверяющий: <имя>
            Артефакт: v${version}, <SHA проверенного коммита>
            Основание: <краткий результат и ссылка на квитанцию>
            Оговорки или действие: <если есть>
            \`\`\`

            Комментарий делает вердикт видимым и не заменяет отдельную подписанную аттестацию. Этот issue сам по себе не устанавливает обязательную проверку подписи или комментария для main. Для чувствительного patch-релиза автор запускает этот workflow вручную с его версией: автоматический issue создаётся только для x.y.0.

            ## Промпт (агент прочитает сам — не для ручного копирования)

            <details>
            <summary>Развернуть промпт</summary>

            \`\`\`
            ${promptBody}
            \`\`\`

            </details>

            ---

            После разбора находок, нужного вердикта слоя 6 и создания отдельных открытых задач для нерешённых существенных находок — закрыть это напоминание. Закрытие напоминания не закрывает задачи с находками.`;

            // One reminder per version: a CLOSED issue with the same title counts too, and every page of the
            // label's issues is read (newest first; a manual run for an old version can need page 2 and later).
            // Looking at open issues only re-created it on the next update-manifest.json push after the audit
            // issue had been closed.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'release-audit',
              per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              console.log(`Issue already exists: #${existing.number} (${existing.state})`);
              core.setOutput('created', 'false');
              core.setOutput('number', existing.number);
              core.setOutput('url', existing.html_url);
            } else {
              const { data } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['release-audit']
              });
              console.log(`Created issue #${data.number}: ${data.html_url}`);
              core.setOutput('created', 'true');
              core.setOutput('number', data.number);
              core.setOutput('url', data.html_url);
            }
