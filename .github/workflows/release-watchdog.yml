name: Release Watchdog

# WP-529 (29.09.2026): сторож застрявшего релизного PR. release-candidate.yml
# (до 10.11.2026 — weekly-release.yml) открывает PR release/vX, дальше нужен один человеческий шаг - слияние. PR
# из 27.09 провисел два дня: автоназначение reviewer не сработало как сигнал.
# Этот workflow ежедневно ищет открытые PR из веток release/* старше
# STALE_HOURS и заводит по одному обращению (issue) на PR+head-коммит -
# GitHub присылает пилоту уведомление. С WP-529 Ф268 запрос release/vX.Y.Z
# открыт всю проверку и вливается после выхода: пока метки vX.Y.Z нет, сторож
# молчит, а после неё напоминает об обратном слиянии (MERGE_BACK_HOURS).
# Он не часть создания релиза: падение
# сторожа не влияет на выпуск, а выпуск не зависит от сторожа.
#
# Канал в бота (Telegram) - отдельный шаг ниже, он выключен, пока в
# переменной репозитория PILOT_NOTICE_ENDPOINT не задан адрес. Сторона бота
# (эндпоинт для одного получателя-пилота, не для подписчиков) пока не
# создана: DS-IT-systems для агента read-only.

on:
  schedule:
    - cron: '30 4 * * *'  # 07:30 MSK
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    env:
      GH_TOKEN: ${{ github.token }}
      STALE_HOURS: "12"
      MERGE_BACK_HOURS: "24"
    steps:
      - name: Close notices for PRs that are no longer open
        run: |
          gh issue list --label release-pr-waiting --state open --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' | while IFS=$'\t' read -r ISSUE TITLE; do
            PR=$(printf '%s' "$TITLE" | sed -n 's/.*PR #\([0-9][0-9]*\).*/\1/p')
            [ -n "$PR" ] || continue
            STATE=$(gh pr view "$PR" --json state --jq .state 2>/dev/null || echo UNKNOWN)
            if [ "$STATE" = "MERGED" ] || [ "$STATE" = "CLOSED" ]; then
              gh issue close "$ISSUE" --comment "PR #$PR: $STATE - обращение закрыто автоматически."
            fi
          done

      # WP-529 Ф268: a release PR release/vX.Y.Z -> main is opened at cut and stays open
      # for the whole check; it is merged back only after the release. So no notice while
      # vX.Y.Z is not tagged (the release is still being checked). Once the tag exists, the
      # PR open MERGE_BACK_HOURS after the tag is the real stall: main lacks the version and
      # the CHANGELOG section, and the next cut refuses. One issue per PR and version, edited
      # in place on later runs. Other release/* heads keep the STALE_HOURS rule.
      - name: Notify about stale release PRs
        id: notify
        run: |
          gh label create release-pr-waiting --description "Release PR is waiting for the pilot" --color FBCA04 2>/dev/null || true
          NOW=$(date -u +%s)
          FOUND=""
          REPO="$GITHUB_REPOSITORY"
          ISSUES=$(gh issue list --label release-pr-waiting --state all --limit 200 --json number,title,state)

          # tag_time <tag>: unix time the tag was made; empty when the tag does not exist.
          tag_time() {
            local ref sha
            ref=$(gh api "repos/$REPO/git/ref/tags/$1" 2>/dev/null) || return 0
            sha=$(printf '%s' "$ref" | jq -r '.object.sha')
            if [ "$(printf '%s' "$ref" | jq -r '.object.type')" = tag ]; then
              gh api "repos/$REPO/git/tags/$sha" | jq -r '.tagger.date | fromdateiso8601'
            else
              gh api "repos/$REPO/git/commits/$sha" | jq -r '.committer.date | fromdateiso8601'
            fi
          }

          while IFS=$'\t' read -r PR HEAD BASE SHA CREATED_AT URL; do
            if [[ "$HEAD" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              VER="${BASH_REMATCH[1]}"
              TAG_AT=$(tag_time "v$VER")
              if [ -z "$TAG_AT" ]; then
                echo "PR #$PR: выпуск v$VER ещё проверяется (метки нет) — напоминание не нужно."
                continue
              fi
              [ "$BASE" = main ] || continue
              AGE_H=$(( (NOW - TAG_AT) / 3600 ))
              [ "$AGE_H" -ge "$MERGE_BACK_HOURS" ] || continue
              KEY="PR #$PR v$VER"
              TITLE="Обратное слияние просрочено: $KEY не влит в main уже ${AGE_H} ч после выпуска"
              BODY="Выпуск v$VER вышел (метка поставлена ${AGE_H} ч назад), а его запрос $URL (release/v$VER → main) всё ещё открыт. Пока он не влит, в main нет номера версии и раздела CHANGELOG этого выпуска, и следующая нарезка (Release Candidate, режим cut) откажет. Влейте его; конфликты с правками main сводит Разработчик. Обращение закроется само после слияния или закрытия PR."
              ISSUE=$(printf '%s' "$ISSUES" | jq -r --arg key "$KEY" \
                '[.[] | select(.state == "OPEN" and (.title | contains($key)))][0].number // empty')
              if [ -n "$ISSUE" ]; then
                gh issue edit "$ISSUE" --title "$TITLE" --body "$BODY"
              else
                gh issue create --label release-pr-waiting --title "$TITLE" --body "$BODY"
              fi
              FOUND="${FOUND}${PR} "
              continue
            fi
            AGE_H=$(( (NOW - $(printf '%s' "$CREATED_AT" | jq -Rr 'fromdateiso8601')) / 3600 ))
            [ "$AGE_H" -ge "$STALE_HOURS" ] || continue
            KEY="PR #$PR @${SHA:0:7}"
            EXISTING=$(printf '%s' "$ISSUES" | jq --arg key "$KEY" '[.[] | select(.title | contains($key))] | length')
            if [ "$EXISTING" -eq 0 ]; then
              gh issue create --label release-pr-waiting \
                --title "Релизный $KEY ждёт слияния уже ${AGE_H} ч" \
                --body "Открытый релизный PR: $URL (коммит ${SHA:0:7}, возраст ${AGE_H} ч). Проверьте статус release-receipt и сливайте, если он зелёный. Обращение закроется само после слияния или закрытия PR."
            fi
            FOUND="${FOUND}${PR} "
          done < <(gh pr list --state open --limit 200 --json number,headRefName,baseRefName,headRefOid,createdAt,url \
            | jq -r '.[] | select(.headRefName | startswith("release/"))
                | [.number, .headRefName, .baseRefName, .headRefOid, .createdAt, .url] | @tsv')
          echo "found=${FOUND}" >> "$GITHUB_OUTPUT"

      - name: Send notice to the pilot channel (optional, fail-open)
        # Выключено, пока PILOT_NOTICE_ENDPOINT не задан. Получатель - только
        # пилот; не использовать /api/template-update (он для подписчиков).
        if: steps.notify.outputs.found != '' && vars.PILOT_NOTICE_ENDPOINT != ''
        continue-on-error: true
        env:
          ENDPOINT: ${{ vars.PILOT_NOTICE_ENDPOINT }}
          WEBHOOK_SECRET: ${{ secrets.TEMPLATE_WEBHOOK_SECRET }}
          PRS: ${{ steps.notify.outputs.found }}
        run: |
          curl -sS --max-time 10 -X POST "$ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d "{\"recipient\":\"pilot\",\"kind\":\"release-pr-waiting\",\"prs\":\"$PRS\"}"
