name: Weekly Release

# Еженедельно (Вс 20:00 UTC = Пн 00:00 MSK+1) проверяет CHANGELOG.md:
# если секция [Unreleased] непустая — по расписанию бампает patch-версию
# в update-manifest.json и открывает PR. Ручной запуск позволяет явно
# выбрать patch или minor; тип выпуска не выводится из сообщений коммитов.
#
# WP-529 (31.08.2026): прямой `git push origin main` от бота не проходит
# (`GH006: Protected branch update failed`, main защищён), поэтому job
# открывает PR с бампом, а не пушит в main.
#
# WP-529 Ф-релиз (29.09.2026, проверено через API): main требует только
# статус `release-receipt` (enforce_admins, 0 approvals, code owner не
# нужен). PR, открытый через GITHUB_TOKEN, получает pull_request-запуски в
# состоянии `action_required` (правило GitHub для PR от GITHUB_TOKEN) —
# `release-receipt` не выполняется, слияние остаётся BLOCKED. Оба прошлых
# релиза держались на ручном «Approve and run» пилота (#843: запуски
# стартовали через 17 минут после создания). Поэтому после открытия PR
# шаг «Validate the release branch» явно запускает validate-template.yml
# через workflow_dispatch (документированное исключение из anti-recursion
# для GITHUB_TOKEN) — check run встаёт на head-коммит PR, слияние
# становится доступным без ручного одобрения. release.yml от такого
# запуска не срабатывает: он слушает только ветку main.
#
# WP-7 Ф62 (10.08.2026): исходная причина вообще звать validate перед
# релизом — раньше бамп версии никак не тестировался перед тем, как
# release.yml создавал тег. Это по-прежнему так: PR проходит все
# обязательные проверки (включая release-receipt) прежде чем его можно
# смерджить.
#
# Причина автоматизации в целом: раньше версия бампалась только вручную —
# паузы между выпусками доходили до 2-3 недель, хотя коммиты в
# [Unreleased] шли почти ежедневно (см. docs/RELEASE-PROCESS.md). Теперь
# ручной шаг — только мердж уже готового PR, не сборка бампа с нуля.

on:
  schedule:
    - cron: '0 20 * * 0'  # Вс 20:00 UTC
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Тип выпуска: patch для исправлений, minor для новой функции'
        required: true
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: write
  pull-requests: write
  actions: write    # dispatch validate-template.yml on the release branch
  issues: write     # signal a skipped release (see last step)

jobs:
  weekly-bump:
    runs-on: ubuntu-latest
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Unreleased has content
        id: check
        run: |
          BODY=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          BODY_TRIMMED=$(echo "$BODY" | sed '/^\s*$/d')
          if [ -z "$BODY_TRIMMED" ]; then
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "[Unreleased] пуст — нечего выпускать."
          else
            echo "has_content=true" >> "$GITHUB_OUTPUT"
            echo "[Unreleased] содержит изменения — бампаем версию."
          fi

      - name: Bump selected version in manifest
        if: steps.check.outputs.has_content == 'true'
        id: bump
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'patch' }}
        run: |
          CURRENT=$(grep -m1 '"version"' update-manifest.json \
            | sed 's/.*"version"[[:space:]]*:[[:space:]]*"//;s/".*//')
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid manifest version: $CURRENT" >&2
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$RELEASE_TYPE" in
            patch) NEW="$MAJOR.$MINOR.$((10#$PATCH + 1))" ;;
            minor) NEW="$MAJOR.$((10#$MINOR + 1)).0" ;;
            *) echo "Unsupported release_type: $RELEASE_TYPE" >&2; exit 1 ;;
          esac
          python3 - "$NEW" <<'EOF'
          import json, sys
          with open('update-manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          m['version'] = sys.argv[1]
          with open('update-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
              f.write('\n')
          EOF
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Version bumped ($RELEASE_TYPE): $CURRENT -> $NEW"

      - name: Flush Unreleased section to new version
        if: steps.check.outputs.has_content == 'true'
        run: bash scripts/changelog-flush.sh --version "${{ steps.bump.outputs.version }}"

      # 2026-08-20 rake, reproduced empirically before this fix (WP-529): the
      # bump commit changed version+CHANGELOG only. README badge stayed on the
      # old version (release-sync red) and the manifest still carried the
      # pre-flush CHANGELOG.md sha256 (validate B2 red) — release.yml, which
      # is subscribed to a GREEN Validate Template, never fired, and every
      # release needed a manual follow-up commit.
      - name: Sync version badge and rebuild manifest for the bump commit
        if: steps.check.outputs.has_content == 'true'
        run: |
          bash scripts/sync-version-badge.sh --fix
          bash generate-manifest.sh

      - name: Commit to a release branch
        if: steps.check.outputs.has_content == 'true'
        id: commit
        run: |
          BRANCH="release/v${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add update-manifest.json CHANGELOG.md README.md
          git commit -m "chore(release): weekly auto-bump to v${{ steps.bump.outputs.version }}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        # Смердженный PR даёт обычный push-коммит, который штатно запускает
        # validate-template.yml → release.yml. До слияния проверки на PR
        # запускает следующий шаг (см. шапку файла).
        if: steps.check.outputs.has_content == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "chore(release): weekly auto-bump to v${{ steps.bump.outputs.version }}" \
            --body "Еженедельный автобамп версии. Мердж запускает обычный релизный конвейер (validate → release) через штатный push-триггер." \
            --base main \
            --head "${{ steps.commit.outputs.branch }}"

      - name: Validate the release branch
        # PR от GITHUB_TOKEN получает pull_request-запуски в action_required,
        # release-receipt не выполняется. workflow_dispatch — документированное
        # исключение: check run встаёт на head-коммит release-ветки.
        if: steps.check.outputs.has_content == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run validate-template.yml --ref "${{ steps.commit.outputs.branch }}"

      - name: Signal a skipped release
        # 20.09.2026: [Unreleased] был пуст при 10 коммитах с прошлого тега —
        # workflow молча ничего не выпустил. Пустой [Unreleased] при заметном
        # числе коммитов — это пропущенные заметки, а не «нечего выпускать».
        if: steps.check.outputs.has_content == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_COMMITS: "5"
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "Нет тегов v* — сигнал не нужен."
            exit 0
          fi
          COUNT=$(git rev-list --count "$LAST_TAG"..HEAD)
          if [ "$COUNT" -lt "$MIN_COMMITS" ]; then
            echo "С $LAST_TAG всего $COUNT коммитов (< $MIN_COMMITS) — сигнал не нужен."
            exit 0
          fi
          OPEN=$(gh issue list --label release-skipped --state open --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "Открытое обращение release-skipped уже есть — дубль не создаём."
            exit 0
          fi
          gh label create release-skipped --description "Weekly release skipped: empty [Unreleased]" --color B60205 2>/dev/null || true
          gh issue create --label release-skipped \
            --title "Недельный релиз пропущен: $COUNT коммитов с $LAST_TAG, [Unreleased] пуст" \
            --body "Weekly Release запустился, но секция [Unreleased] в CHANGELOG.md пуста, хотя с $LAST_TAG накопилось $COUNT коммитов. Выпуск не создан. Допишите заметки в [Unreleased] (или запустите scripts/changelog-append.sh) и перезапустите workflow Weekly Release вручную."
