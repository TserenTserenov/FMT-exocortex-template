name: Validate Template

# see VR.SC.006 (release-verification-protocol), VR.M.006 (5-layer verification)
# see AR.203 (release verification trigger)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # CI-MacOS-Costs (WP-7, 09.08.2026): macOS runners cost 10x an ubuntu-minute
  # (GitHub Actions pricing) and every push to main ran the full os×gov_repo
  # matrix — 196 runs/month, ~$13.4/mo gross just for this job. macOS coverage
  # doesn't need to fire on every agentic commit to be effective; a nightly
  # run plus every PR (external contributors, review gate) catches the same
  # portability regressions this matrix exists for (0.28.12 BUG-2..4), just
  # not within minutes of a push nobody's about to release from unreviewed.
  schedule:
    - cron: '0 2 * * *'  # 05:00 MSK
  # WP-529: weekly-release.yml opens a PR via GITHUB_TOKEN; its
  # pull_request runs wait for approval from an owner with write access.
  # workflow_dispatch is kept for manual diagnostics, but its jobs do not
  # satisfy the required release-receipt PR even on the same head.
  # release.yml listens for check completion only on the main branch.
  workflow_dispatch:

# #1010 F16: every job only reads the repository and uploads artifacts; a token with the
# default (broad) scope is not needed.
permissions:
  contents: read

jobs:
  # Issue #1032: prove the early refusal on actual Git Bash and native Python.
  windows-session-guard:
    runs-on: windows-latest
    # issue #1223: this job runs scripts/tests/* helpers, and scripts/tests/
    # is in update-manifest.json excluded_paths -- a fork never has them and
    # this check can never pass there regardless of fork content.
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # Issue #1359: the degraded Git Bash mode (open/close --housekeeping, note-file)
      # must work on the real runner, not only under a stubbed uname.
      - name: Degraded session-guard mode on Git Bash
        run: bash scripts/tests/test_session_guard_gitbash.sh
      - name: Reject native Windows session before canonical writes
        run: bash scripts/tests/test_issue_1032_windows_fail_closed.sh

  # Defense-in-depth for the case of --no-verify in pre-commit + a direct push.
  # A separate job so it runs independently of validate/shellcheck (does not depend on their success).
  release-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # WP-7 Phase 62 item 4: full history is needed for git diff (keyword-warning below)
      - name: Check CHANGELOG/manifest version sync
        run: |
          if [ ! -f "CHANGELOG.md" ] || [ ! -f "update-manifest.json" ]; then
            echo "SKIP: CHANGELOG.md или update-manifest.json не найдены"
            exit 0
          fi
          CHANGELOG_VERSION=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
              | sed 's/^## \[//;s/\]$//' || true)
          MANIFEST_VERSION=$(grep -m1 '"version"' update-manifest.json \
              | sed 's/.*"version"[[:space:]]*:[[:space:]]*"//;s/".*//' || true)
          if [ -z "$CHANGELOG_VERSION" ] || [ -z "$MANIFEST_VERSION" ]; then
            echo "FAIL: не удалось извлечь версии (CHANGELOG=$CHANGELOG_VERSION, manifest=$MANIFEST_VERSION)"
            exit 1
          fi
          if [ "$CHANGELOG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "FAIL: рассинхрон версий!"
            echo "  CHANGELOG.md top:     $CHANGELOG_VERSION"
            echo "  update-manifest.json: $MANIFEST_VERSION"
            echo "  update.sh --check парсит manifest — пользователи не получат обновлений."
            echo "  Fix: bump version в update-manifest.json до $CHANGELOG_VERSION"
            exit 1
          fi
          echo "PASS: CHANGELOG/manifest version sync ($CHANGELOG_VERSION)"
      - name: Check README version badge sync
        run: bash scripts/sync-version-badge.sh --check

      # WP-7 Phase 62 item 4: a safety net against a missed [security] label when marking up the
      # CHANGELOG (allowlist/render -- scripts/changelog-append.sh). Warning
      # only, never blocks -- DRR:
      # decisions/2026-08/2026-08-10-wp-7-arhgeyt-changelog-klassifikaciya-bez-lts.md
      - name: Warn on unlabeled security-like CHANGELOG entries
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning file=CHANGELOG.md::CHANGELOG.md отсутствует; проверка меток не выполнена."
            exit 0
          fi

          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "push" ]; then
            BASE="${{ github.event.before }}"
          elif [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            echo "SKIP: событие '$EVENT' (schedule/workflow_dispatch) не несёт нового диапазона коммитов"
            exit 0
          fi

          # Общая логика извлечения — scripts/changelog-diff-lines.sh
          # (выделена из дублей в этом файле и notify-update.yml, code review
          # 13.08: третье повторение одной и той же логики, DP.SC.172 P2).
          if ! NEW_LINES=$(bash scripts/changelog-diff-lines.sh "$BASE"); then
            echo "::warning file=CHANGELOG.md::Не удалось извлечь новые строки CHANGELOG; проверка меток не выполнена."
            exit 0
          fi

          if [ -z "$NEW_LINES" ]; then
            echo "PASS: нет новых строк CHANGELOG.md для проверки"
            exit 0
          fi

          # Узкий список — голые "leak"/"credential" дают false-positive на
          # рутинных багфиксах вроде "fix: memory leak" (пир-ревью с Codex,
          # 2026-08-13).
          PATTERN='vulnerability|CVE-[0-9]{4}-[0-9]+|exploit|credential leak|secret leak|token leak|data breach|privilege escalation|\bRCE\b'

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Якорим на позицию бирки-префикса, не голую подстроку — иначе
            # "[migration] fix: ... CVE-2026-9999 in [security]-adjacent
            # helper" молча проходит без предупреждения (найдено code review
            # 13.08, verify-подагент).
            keyword_rc=0
            grep -qiE "$PATTERN" <<< "$line" || keyword_rc=$?
            if [ "$keyword_rc" -gt 1 ]; then
              echo "::warning file=CHANGELOG.md::Поиск security-ключевых слов завершился с кодом $keyword_rc; проверка меток не выполнена."
              exit 0
            fi
            [ "$keyword_rc" -eq 1 ] && continue

            label_rc=0
            grep -q '^- \[security\] ' <<< "$line" || label_rc=$?
            if [ "$label_rc" -gt 1 ]; then
              echo "::warning file=CHANGELOG.md::Поиск метки [security] завершился с кодом $label_rc; проверка меток не выполнена."
              exit 0
            fi
            if [ "$label_rc" -eq 1 ]; then
              echo "::warning file=CHANGELOG.md::возможно security-пункт без метки [security]: $line"
            fi
          done <<< "$NEW_LINES"

          echo "PASS: проверка завершена (предупреждение — не блокировка)"

  # Integration contract validator + fresh-install smoke-test.
  # Defense-in-depth for the case of `git commit --no-verify` in pre-commit.
  # Root of the bug (29 Apr, 0.29.13 regression): template-sync pushed pre-0.29.5
  # code into FMT, the validators were NOT in CI -- Evgenii found it on a fresh clone, ours
  # commit went through. Gate: the same 2 scripts that Evgenii runs locally.
  #
  # Split ubuntu/macOS into two jobs (CI-MacOS-Costs, WP-7, 09.08.2026, option
  # B1): macOS is 10x an ubuntu-minute in GitHub's billing, and every one of
  # 196 push-to-main runs/month paid that rate for portability coverage that
  # doesn't need to fire within minutes of an agentic commit to do its job.
  # ubuntu below still runs on every push/PR (fast feedback for the common
  # case); macOS runs on PR (review gate for external contributors) and
  # nightly (catches a portability regression that slipped through by next
  # morning) — same coverage cadence, ~80% fewer macOS-minutes billed.
  integration-contract-ubuntu:
    # issue #1223: setup/integration-contract-validator.sh and
    # setup/smoke-test-fresh-install.sh are in excluded_paths -- a fork's
    # copy is permanently stale (frozen at whatever sync delivered it last)
    # and this check verifies an authored-only delivery contract, not fork
    # content.
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    # GOVERNANCE_REPO matrix (12 May, after Bug 1 b24639f): smoke runs with
    # different GOVERNANCE_REPO values to catch hardcoded /DS-strategy/
    # paths that pass with the default value.
    strategy:
      fail-fast: false
      matrix:
        gov_repo: [DS-strategy, DS-pilot-strategy]
    runs-on: ubuntu-latest
    env:
      SMOKE_GOVERNANCE_REPO: ${{ matrix.gov_repo }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 jq
      - name: Run integration-contract-validator (8 detectors)
        run: bash setup/integration-contract-validator.sh
      - name: Run smoke-test-fresh-install (GOVERNANCE_REPO=${{ matrix.gov_repo }})
        run: bash setup/smoke-test-fresh-install.sh
      - name: Run detector regression fixtures (regex gap guard)
        run: bash setup/test-detectors.sh
      - name: Run DayPlan-validator hook regression (trigger gap guard)
        run: bash setup/test-hook-dayplan-validator.sh
      - name: Ensure jsonschema available (attestation statement test contract)
        run: |
          python3 -c "import jsonschema" 2>/dev/null && exit 0
          python3 -m pip install --user jsonschema
      - name: Run WP-529 Ф21 attestation digest tests (cross-OS determinism)
        run: bash setup/test-attestation-canonical-digest.sh
      - name: Run WP-529 Ф21 attestation statement tests
        run: bash setup/test-attestation-build-statement.sh
      - name: Run WP-561 Ф25 week-review delivery postcondition tests
        run: bash setup/test-week-review-delivery-postcondition.sh
      - name: Run WP-530 Ф72 strategist isolated scenario tests
        run: bash setup/test-strategist-isolated-scenarios.sh
      - name: Run WP-529 changelog gate tests
        run: bash setup/test-check-changelog-entry.sh

  # #1030/#1005: exercise lock publication and both timeout process trees
  # under Git for Windows Bash with native Windows Python. POSIX signal probes
  # stay in the ordinary Linux/macOS issue-test run.
  issue-1030-windows:
    runs-on: windows-latest
    # issue #1223: exercises scripts/tests/test_issue_657.sh and friends,
    # excluded from delivery the same way as integration-contract-ubuntu above.
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Run #1030 lock barrier with Git Bash and native Python
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*) ;;
            *) echo "ERROR: this check requires Git for Windows Bash" >&2; exit 1 ;;
          esac
          python -c 'import os; assert os.name == "nt", os.name'
          shim_dir=$(mktemp -d)
          trap 'rm -rf "$shim_dir"' EXIT
          printf '%s\n' '#!/usr/bin/env bash' 'exec python "$@"' > "$shim_dir/python3"
          chmod +x "$shim_dir/python3"
          PATH="$shim_dir:$PATH" bash scripts/tests/test_issue_657.sh --barrier-only
      - name: Run #1005 Sync Gate and FPF timeout trees on native Windows
        run: |
          python -c 'import os; assert os.name == "nt", os.name'
          shim_dir=$(mktemp -d)
          trap 'rm -rf "$shim_dir"' EXIT
          printf '%s\n' '#!/usr/bin/env bash' 'exec python "$@"' > "$shim_dir/python3"
          chmod +x "$shim_dir/python3"
          PATH="$shim_dir:$PATH" bash scripts/tests/test_issue_1005_sync_gate_no_posix_signals.sh --native-windows
          PATH="$shim_dir:$PATH" bash scripts/tests/test_issue_1005_update_fpf_timeout_no_pkill.sh --native-windows

  # #1010a: decides whether this run is the one release.yml turns into a
  # release, with the rule release-receipt.sh enforces (one implementation:
  # scripts/release-receipt.sh --release-run). The macOS job below runs on
  # such a run even on push, because the receipt treats its skip as a failure.
  release-run:
    runs-on: ubuntu-latest
    outputs:
      release_run: ${{ steps.detect.outputs.release_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # tags are needed: an already tagged version is not a release
      - name: Detect release run
        id: detect
        run: |
          release_run=$(bash scripts/release-receipt.sh --release-run)
          echo "release_run=$release_run" >> "$GITHUB_OUTPUT"
          echo "release run: $release_run"

  integration-contract-macos:
    # issue #1223: same undelivered setup/ dependency as integration-contract-ubuntu above.
    # #1010a: also on a release run (see release-run above); an ordinary push
    # to main still skips it, and the receipt reports that skip as «пропущено».
    # !cancelled(): a failed detector must not skip the PR/schedule runs; on a
    # push its empty output skips the job and the receipt, which decides the
    # release run itself, fails on that skip.
    needs: release-run
    if: >-
      !cancelled() &&
      github.repository == 'TserenTserenov/FMT-exocortex-template' &&
      (github.event_name == 'pull_request' || github.event_name == 'schedule' ||
       needs.release-run.outputs.release_run == 'true')
    strategy:
      fail-fast: false
      matrix:
        gov_repo: [DS-strategy, DS-pilot-strategy]
    runs-on: macos-latest
    env:
      SMOKE_GOVERNANCE_REPO: ${{ matrix.gov_repo }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 20  # WP-529 Phase 9: check-delivery-route-label.sh needs a resolvable prior commit for its smoke run below
      - name: Install dependencies
        run: brew install jq  # python3 preinstalled
      # WP-529 Phase 9 (found live by this job's own first real run, 20.08):
      # check-critical-files-map.sh/check-delivery-route-label.sh both go
      # through find-python3.sh, which hard-requires PyYAML importable —
      # this job installed jq but never PyYAML, so the resolver failed
      # before reaching either script's own logic (exit 2, not the bash3.2
      # class this job exists to catch). Same 3-step fallback the `validate`
      # job already uses for the identical dependency (import check → pip
      # --user → OS-level install), macOS-adapted: Homebrew's python3 is
      # PEP668-managed, so --user alone can still refuse — --break-system-
      # packages is the documented escape hatch for exactly this case.
      - name: Ensure PyYAML available (find-python3.sh contract)
        run: |
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m pip install --user pyyaml 2>/dev/null && python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m pip install --user --break-system-packages pyyaml && python3 -c "import yaml"
      - name: Run integration-contract-validator (8 detectors)
        run: bash setup/integration-contract-validator.sh
      - name: Run smoke-test-fresh-install (GOVERNANCE_REPO=${{ matrix.gov_repo }})
        run: bash setup/smoke-test-fresh-install.sh
      - name: Run detector regression fixtures (regex gap guard)
        run: bash setup/test-detectors.sh

      # WP-529 Phase 9 (Evgenii 20.08): these two scripts used to hard-fail on
      # stock macOS /bin/bash (3.2, `declare -A`/`mapfile`) — the `validate`
      # job already runs them, but only on ubuntu-latest, so the exact defect
      # class Evgenii reported went unexercised. Pinned to `/bin/bash`
      # explicitly (not bare `bash`) so this actually hits the system
      # interpreter the finding is about, not a newer Homebrew bash the
      # runner's PATH might expose. `--map-consistency`-only concern here —
      # the ubuntu `validate` job already checks correctness against the real
      # PR base; this smoke run only needs SOME resolvable prior commit to
      # exercise the array-diff code path (the part that used to crash).
      - name: Run check-critical-files-map.sh on system /bin/bash (3.2)
        run: /bin/bash scripts/check-critical-files-map.sh
      - name: Run check-delivery-route-label.sh on system /bin/bash (3.2)
        run: |
          # This step cares whether the INTERPRETER chokes (the actual class
          # of bug), not whether the smoke SHA happens to have an unlabeled
          # category change (a legitimate business-rule exit 1 on synthetic
          # data, not a defect) — `set -euo pipefail` makes both look like
          # "exit 1" from the outside, so distinguish by grepping stderr for
          # a real interpreter crash signature instead of trusting the exit
          # code alone.
          SMOKE_BASE=$(git rev-list --max-count=1 --skip=5 HEAD 2>/dev/null)
          [ -n "$SMOKE_BASE" ] || SMOKE_BASE=$(git rev-list --max-count=1 HEAD~1 2>/dev/null || git rev-parse HEAD)
          if ! /bin/bash scripts/check-delivery-route-label.sh "$SMOKE_BASE" > /tmp/route-label-smoke.log 2>&1; then
            if grep -qiE 'invalid option|command not found|bad substitution|unbound variable' /tmp/route-label-smoke.log; then
              echo "Interpreter-level crash under system bash — see log below:" >&2
              cat /tmp/route-label-smoke.log >&2
              exit 1
            fi
            echo "Non-zero exit but no crash signature — treating as a legitimate business-rule result on synthetic smoke data:"
            cat /tmp/route-label-smoke.log
          fi
      - name: Ensure jsonschema available (attestation statement test contract)
        run: |
          python3 -c "import jsonschema" 2>/dev/null && exit 0
          python3 -m pip install --user jsonschema 2>/dev/null && python3 -c "import jsonschema" && exit 0
          python3 -m pip install --user --break-system-packages jsonschema
      # WP-529 Phase 21 (peer-session 2026-08-27-14-wp529-f21-implement-attestation,
      # turn 11): this is the actual cross-OS determinism guard for the
      # attestation digest — same golden vector, same hardcoded expected
      # hash, run on both ubuntu-latest (above) and macos-latest (here). Run
      # under system /bin/bash (3.2), same reasoning as the two steps above:
      # the script claims bash-3.2 compatibility, so prove it against the
      # real system interpreter, not a newer Homebrew bash the runner's PATH
      # might expose ahead of it.
      - name: Run WP-529 Ф21 attestation digest tests (cross-OS determinism)
        run: /bin/bash setup/test-attestation-canonical-digest.sh
      - name: Run WP-529 Ф21 attestation statement tests
        run: /bin/bash setup/test-attestation-build-statement.sh

      # WP-7 (template cleanup, 2026-11-01): the update.sh step that removes the author's
      # ext-railway holds a heredoc inside $( ) and relies on BSD mktemp/cp -p/
      # stat; changelog-append.sh relies on BSD date and awk; check-copy-pairs.sh relies on
      # BSD find/xargs/cksum. The review noted that this was not verified on the system
      # bash 3.2. Run under /bin/bash for the same reason as the steps above.
      - name: Run WP-7 template cleanup tests on system /bin/bash (3.2)
        run: |
          /bin/bash scripts/tests/test_update_drop_dead_railway_mcp.sh
          /bin/bash scripts/tests/test_changelog_append_blank_lines.sh
          /bin/bash scripts/tests/test_template_hygiene_checks.sh

  # Upgrade-flow regression test (0.29.18).
  # Root of the bug (0.29.13): template-sync overwrote FMT files -- the fresh
  # build smoke test does not catch this, because build-runtime creates `.iwe-runtime` from scratch,
  # while the pilot upgrades on top of the existing state. This job simulates:
  # checkout previous version → setup → checkout HEAD → re-run validator.
  upgrade-test:
    runs-on: ubuntu-latest
    # issue #1223: calls setup/smoke-test-fresh-install.sh, excluded from
    # delivery the same way as integration-contract-ubuntu above.
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # full history for git log
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 jq
      - name: Determine previous version
        id: prev
        run: |
          # Найти предыдущий коммит, поднявший version в update-manifest.json.
          # Логика: git log -p update-manifest.json → найти второй "version" bump
          # → его commit hash. Это предыдущая опубликованная версия.
          PREV_SHA=$(git log --format=%H -- update-manifest.json | sed -n '2p')
          if [ -z "$PREV_SHA" ]; then
            echo "SKIP: нет предыдущей версии в истории update-manifest.json"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          PREV_VER=$(git show "$PREV_SHA:update-manifest.json" 2>/dev/null \
            | grep -m1 '"version"' | sed 's/.*"version"[[:space:]]*:[[:space:]]*"//;s/".*//')
          echo "PREVIOUS: $PREV_VER ($PREV_SHA)"
          echo "sha=$PREV_SHA" >> $GITHUB_OUTPUT
          echo "ver=$PREV_VER" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
      - name: Check rename coverage (issue #218)
        if: steps.prev.outputs.skip != 'true'
        run: |
          git show "${{ steps.prev.outputs.sha }}:update-manifest.json" > /tmp/prev-manifest.json
          python3 scripts/check-manifest-rename-coverage.py /tmp/prev-manifest.json update-manifest.json
      - name: Upgrade simulation — checkout prev → smoke → checkout HEAD → validate
        if: steps.prev.outputs.skip != 'true'
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          CURRENT_REF=$(git symbolic-ref --quiet --short HEAD || true)
          # Шаг 1: build-runtime на предыдущей версии (имитация уже-установленного пилота).
          git checkout ${{ steps.prev.outputs.sha }}
          bash setup/smoke-test-fresh-install.sh > /tmp/prev_smoke.log 2>&1 || {
            echo "WARN: previous version smoke-test FAILED (это OK — мы тестируем upgrade-flow)"
            tail -20 /tmp/prev_smoke.log
          }
          # Шаг 2: возврат на HEAD, прогон ТЕКУЩЕГО validator + smoke.
          # Старый smoke может менять tracked-файлы и оставлять untracked-мусор.
          # Runner одноразовый: это состояние предыдущей версии нужно отбросить,
          # а не переносить в проверку текущей.
          git reset --hard
          git clean -fd
          # Если HEAD-validator прошёл fresh + после prev-smoke build-runtime — upgrade OK.
          if [ -n "$CURRENT_REF" ]; then
            git checkout "$CURRENT_REF"
          else
            git checkout "$CURRENT_SHA"
          fi
          bash setup/integration-contract-validator.sh
          bash setup/smoke-test-fresh-install.sh
          echo "PASS: upgrade ${{ steps.prev.outputs.ver }} → HEAD не ломает контракт"

  # Vendored guide-kit copy: the tree under guide-kit/ is derived-only — a
  # byte-identical slice of a tagged iwesys/guide-kit release, pinned by
  # scripts/guide-kit-sync-state.yaml (WP-483 Phase 4). In-place edits of the copy
  # (the "edited the wrong clone" failure mode on dev machines) must go red
  # here, not be discovered by users after delivery.
  guide-kit-drift:
    # issue #850: scripts/guide-kit-sync-state.yaml and scripts/guide-kit-sync.sh
    # are in excluded_paths -- a fork's copy is permanently stale, and this
    # check verifies the author's own vendoring is in sync with upstream, not
    # anything a fork needs. Same guard as validate/windows-session-guard/
    # integration-contract-*/issue-1030-windows/upgrade-test above; found by
    # the generic test_issue_850_fork_guard.sh regression test, not reported
    # separately.
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check vendored guide-kit copy matches its pinned source tag
        run: |
          STATE=scripts/guide-kit-sync-state.yaml
          if [ ! -f "$STATE" ] && [ ! -d guide-kit ]; then
            echo "SKIP: guide-kit not vendored yet (no state file, no copy)"
            exit 0
          fi
          if [ -f "$STATE" ] && [ ! -d guide-kit ]; then
            echo "FAIL: $STATE present but guide-kit/ is missing — broken sync?"
            exit 1
          fi
          if [ ! -f "$STATE" ] && [ -d guide-kit ]; then
            echo "FAIL: guide-kit/ present without provenance ($STATE) — was scripts/guide-kit-sync.sh bypassed?"
            exit 1
          fi
          SRC=$(grep -m1 '^source_repo:' "$STATE" | sed 's/^source_repo:[[:space:]]*//')
          TAG=$(grep -m1 '^tag:' "$STATE" | sed 's/^tag:[[:space:]]*//')
          if [ -z "$SRC" ] || [ -z "$TAG" ]; then
            echo "FAIL: cannot parse source_repo/tag from $STATE"
            exit 1
          fi
          TMP=$(mktemp -d)
          git clone --quiet --depth 1 --branch "$TAG" "$SRC" "$TMP"
          # A moved (force-retagged) upstream tag is a different failure than an
          # in-place edit of the copy — without this check the diff below would
          # blame the wrong side ("edited the copy") for an upstream re-tag.
          PINNED=$(grep -m1 '^commit:' "$STATE" | sed 's/^commit:[[:space:]]*//')
          ACTUAL=$(git -C "$TMP" rev-parse HEAD)
          if [ -n "$PINNED" ] && [ "$PINNED" != "$ACTUAL" ]; then
            echo "FAIL: tag $TAG was moved upstream (state pins $PINNED, tag now points to $ACTUAL)."
            echo "  Re-run scripts/guide-kit-sync.sh to re-pin, or restore the original tag upstream."
            exit 1
          fi
          rm -rf "$TMP/.git" "$TMP/.github"
          if diff -r "$TMP" guide-kit; then
            echo "PASS: guide-kit/ is byte-identical to $SRC@$TAG"
          else
            echo "FAIL: guide-kit/ drifted from $SRC@$TAG."
            echo "  Never edit the copy in place — change the source repo, release a tag,"
            echo "  re-run scripts/guide-kit-sync.sh."
            exit 1
          fi
      # continue-on-error: freshness is advisory by design (consensus: warning,
      # not a blocker) — a network hiccup in ls-remote must not redden main.
      - name: Warn when a newer guide-kit release exists (freshness)
        continue-on-error: true
        run: |
          STATE=scripts/guide-kit-sync-state.yaml
          if [ ! -f "$STATE" ]; then
            echo "SKIP: guide-kit not vendored yet"
            exit 0
          fi
          SRC=$(grep -m1 '^source_repo:' "$STATE" | sed 's/^source_repo:[[:space:]]*//')
          TAG=$(grep -m1 '^tag:' "$STATE" | sed 's/^tag:[[:space:]]*//')
          # Stable releases only — sort -V ranks v0.2.0-rc1 above v0.2.0.
          LATEST=$(git ls-remote --tags --refs "$SRC" | awk -F/ '{print $NF}' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$LATEST" ] && [ "$LATEST" != "$TAG" ]; then
            echo "::warning::vendored guide-kit is at $TAG, latest release is $LATEST — run scripts/guide-kit-sync.sh"
          else
            echo "PASS: vendored guide-kit is at the latest release ($TAG)"
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all .sh files
        run: |
          # Severity = error: блокируем только реальные баги, не стиль/false-positive.
          # Пред-существующие warnings (SC2034 unused vars от export-pattern, SC1090
          # source non-constant, SC2155 declare-and-assign, etc) — информативны,
          # не блокируют. При желании ужесточить — поднять до warning.
          # guide-kit/ is a vendored byte-identical release slice (WP-483) —
          # the drift gate forbids in-place fixes, so linting it here would
          # deadlock two blocking gates; upstream CI lints the source instead.
          FAIL=0
          while IFS= read -r -d '' f; do
            if ! shellcheck -S error "$f"; then
              FAIL=1
            fi
          done < <(find . -path ./guide-kit -prune -o -name "*.sh" -type f -print0)
          exit $FAIL

  # WP-5 Ubuntu-audit fact #4/#6: docs/PLATFORM-COMPAT.md listed the safe
  # patterns for macOS-only constructs (osascript, launchctl, date -v, etc.)
  # but nothing enforced them — every concrete bug this audit found was a
  # case the checklist already named. Turns the checklist into a gate.
  platform-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check docs/PLATFORM-COMPAT.md constructs are guarded
        run: bash scripts/check-platform-compat.sh

  validate:
    # issue #850/#1223: this job runs dozens of scripts/tests/* and
    # setup/test-*.sh helpers that are in excluded_paths -- a fork's copy is
    # permanently stale (frozen at whatever sync delivered it last) and this
    # check verifies an authored-only delivery contract, not fork content.
    # Same guard as windows-session-guard/integration-contract-*/upgrade-test
    # above; this job was the one left uncovered, causing the false-positive
    # drift reported in #850.
    if: github.repository == 'TserenTserenov/FMT-exocortex-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # WP-529 Phase 2: check-delivery-route-label.sh needs full history for git diff/show against base

      # C1 fix (0.28.6): CI source-of-truth = local validator (setup/validate-template.sh).
      # CI used to have its own inline blacklist that diverged from the local one -- for example,
      # PROTOCOL_PATHS included `roles/`, which caught conditional refs in strategist prompts.
      # Now CI delegates author-specific / hardcoded-paths / MEMORY-skeleton / required-files /
      # hooks-cross-ref to the local validator; CI-only remain: smoke-test, MCP doc, placeholders.
      - name: Run local validator (source-of-truth)
        run: bash setup/validate-template.sh "$PWD"

      # validate-fmt-scripts: check for personal hardcodes and convention violations.
      # Root of the bug (May 2026): the detector caught legitimate uses (template identity,
      # python fallback, env override) as false positives. Fixed in validate-fmt-scripts.sh.
      # Gate: run in CI so as not to rely only on pre-commit (which is called
      # only when .claude/settings.json is staged) and a manual run.
      - name: Run validate-fmt-scripts (author-specific hardcodes & conventions)
        run: bash scripts/validate-fmt-scripts.sh

      # issue #291: a path in backticks in the platform part of CLAUDE.md (start..SYNC-CORE-END,
      # delivered to 100% of installations via update.sh §1-7 + Agent Core) must
      # exist in the repo or in update-manifest.json -- otherwise it is a dead link on
      # every user installation, not only the author's.
      - name: Check CLAUDE.md platform-section links resolve (issue #291)
        run: python3 scripts/check-claude-md-links.py --strict

      # CI-only check: MCP -- servers connect via claude.ai/settings/connectors
      - name: Check MCP documentation
        run: |
          if grep -q "claude.ai/settings/connectors" setup.sh; then
            echo "PASS: setup.sh contains MCP connector instructions"
          else
            echo "FAIL: setup.sh missing MCP connector instructions"
            exit 1
          fi

      # 6. Smoke-test: hooks do not crash on a clean user environment.
      # Имитируем pristine user: DS-strategy вместо DS-my-strategy, DayPlan с минимальным шаблоном.
      - name: Smoke-test protocol hooks on clean user env
        run: |
          FAIL=0
          TMP=$(mktemp -d)
          export IWE_WORKSPACE="$TMP"
          export IWE_GOVERNANCE_REPO="DS-strategy"
          mkdir -p "$TMP/DS-strategy/current"

          # Минимальный DayPlan, удовлетворяющий SECTIONS из хука
          cat > "$TMP/DS-strategy/current/DayPlan 2026-04-22.md" <<'DAYPLAN'
          ---
          type: daily-plan
          date: 2026-04-22
          ---

          # Day Plan: 22 апреля 2026

          <details open>
          <summary><b>План на сегодня</b></summary>

          **Бюджет дня:** ~4h РП / ~3h физ / Плановый мультипликатор ~1.3x
          mandatory: WP-7 + контент
          carry-over: —
          </details>
          <details>
          <summary><b>Календарь (22 апр)</b></summary>

          | 10:00 | событие | 1h |
          </details>
          <details>
          <summary><b>IWE за ночь (светофор)</b></summary>

          | Scheduler | 🟢 | ok |
          </details>
          <details>
          <summary><b>Наработки Scout (разбор)</b></summary>

          нет находок
          </details>
          <details>
          <summary><b>Разбор заметок</b></summary>

          все обработаны
          </details>
          <details>
          <summary><b>Итоги вчера</b></summary>

          коммитов: 3
          </details>
          DAYPLAN

          # Прогон хука: имитируем PreToolUse с git commit DayPlan
          INPUT=$(jq -n --arg cmd "git add DS-strategy/current/DayPlan\\ 2026-04-22.md && git commit -m test" \
                  '{tool_name: "Bash", tool_input: {command: $cmd}}')
          RESULT=$(echo "$INPUT" | bash .claude/hooks/protocol-artifact-validate.sh)
          DECISION=$(echo "$RESULT" | jq -r '.decision // "allow"')

          if [ "$DECISION" = "block" ]; then
            echo "FAIL: hook blocked commit on clean user env:"
            echo "$RESULT" | jq -r '.reason'
            FAIL=1
          else
            echo "PASS: hook allows commit on clean DS-strategy env"
          fi

          rm -rf "$TMP"
          exit $FAIL

      # B2 gap closure: check that update-manifest.json is in sync with the git tree.
      # verify-manifest.sh runs generate-manifest.sh and compares with the current one.
      # On a mismatch it shows the diff and fix instructions.
      - name: Check manifest completeness (B2)
        run: |
          bash scripts/verify-manifest.sh

      # Evgenii Red Team review 2026-08-19: B2 above only checks that files
      # ALREADY IN the manifest have correct hashes — it says nothing about a
      # tracked file that is in neither manifest.files nor
      # manifest.excluded_paths (a silent delivery-coverage gap, as opposed
      # to a delivered-but-stale hash). check-manifest-coverage.py already
      # existed but was never wired into CI as its own gate.
      - name: Check manifest coverage (no silent delivery gaps)
        run: |
          git ls-files | python3 scripts/check-manifest-coverage.py update-manifest.json

      # WP-529 Phase 1: docs/critical-files-map.yaml must stay consistent
      # with the live classification of generate-manifest.sh -- the same guarantee that B2
      # above gives for update-manifest.json, only for the category map.
      - name: Check critical-files-map consistency
        run: bash scripts/check-critical-files-map.sh

      # WP-529 Phase 2: a change to the composition of a manually curated delivery category
      # (explicit-include/exclude lists, deprecated_files) must carry the
      # trailer Delivery-Route: <category-id> -- otherwise such a decision passes
      # without an explicit signal to the reviewer/CI. base is determined the same way as in
      # release-sync above (push → event.before, PR → base.sha).
      - name: Check delivery-route label on curated category changes
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "push" ]; then
            BASE="${{ github.event.before }}"
          elif [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE=""
          fi
          bash scripts/check-delivery-route-label.sh "$BASE"

      # WP-529 Phase 9 (Evgenii 20.08): anti-regression ratchet, not a compliance
      # proof — stops the count of bare python3/python .py-invocations from
      # growing past the ~15 legacy sites already baselined (see the script's
      # own header for the baseline-update recipe and known blind spots).
      - name: Check python-resolver contract (no new bare python3 calls)
        run: bash scripts/check-python-resolver-contract.sh

      # issue #1114 (phase 1): ratchet gate against NEW open()/Path.open()
      # calls without encoding= — on Windows cp1251 consoles these crash with
      # UnicodeDecodeError/UnicodeEncodeError. Existing violations live in
      # scripts/tests/python-encoding-baseline.txt; the regression test is
      # picked up by run-issue-tests.sh below (test_issue_1114_*.sh).
      - name: Check python encoding gate (issue #1114)
        run: python3 scripts/check-python-encoding.py
      - name: Run cp1251 smoke on platform scripts (issue #1114)
        run: bash scripts/tests/cp1251-smoke.sh

      # setup.sh ↔ update.sh parity. Root (29 June, peer-session 2026-06-29-03):
      # rules-lazy was delivered via update.sh but was absent from the setup.sh for-loop --
      # a fresh install lost the component. check-setup-update-parity existed (WP-315),
      # but was NOT wired into CI (dormant guard), and its regex contract did not cover
      # the "component list" dimension. We wire in both: contract patterns + set-diff.
      - name: Check setup/update parity contract
        run: bash scripts/check-setup-update-parity.sh
      - name: Check setup/update component-set parity
        run: bash scripts/check-component-parity.sh

      # seed snapshots (WP-5 Ubuntu-audit, 2026-07-22 fact #3): script-promote.sh
      # promotes a personal script → scripts/, but does NOT write to seed/strategy/scripts/ --
      # without this gate drift stays silent until a new user runs into the old
      # pipeline (found: day-open-pipeline.sh/scaffold.sh diverged by hundreds of lines).
      - name: Check seed snapshots match scripts/ (drift guard)
        run: bash scripts/check-seed-drift.sh

      # WP-7 (template cleanup, 2026-11-01): check-seed-drift.sh only sees
      # copies marked SNAPSHOT. Byte-for-byte copies without the mark (seed/,
      # extensions/agent-inbox/, .claude/lib/) were checked by nobody; we also catch
      # new unregistered copies.
      - name: Check byte-identical copy pairs (drift guard)
        run: bash scripts/check-copy-pairs.sh

      # WP-7 (template cleanup, 2026-11-01): the template .mcp.json shipped the
      # author's ext-railway with a command from the author's secrets directory --
      # on user machines the server failed on every start.
      - name: Check shipped default config has no author secret paths
        run: bash scripts/check-shipped-config-secrets.sh

      # issue #343/#347: 14 regression tests sat in the repo and ran nowhere --
      # none of them guarded any run. The full set takes ~2 minutes.
      - name: Run update.sh edge-case regression tests (T1-T26)
        run: bash setup/test-update-edge-cases.sh

      # issue #1039: a Linux role update may refresh only the schedule owned by
      # this installation; disabled timers and foreign cron blocks stay intact.
      - name: Run Linux scheduler update ownership test
        run: bash setup/test-update-linux-scheduler.sh

      - name: Run existing note-review launchd migration tests
        run: python3 setup/test-strategist-notereview-migration.py

      # issue #226: the test sat in the repo since 6 July, never wired into CI --
      # found 2026-08-10 during an audit of the delivery pipeline (WP-7 Phase 62). E2E smoke on
      # 3 fixes of a real incident (CLAUDE.md conflict on merge, repair-pass
      # at TOTAL_CHANGES=0) -- guards exactly the class of regression that has already occurred.
      - name: Run update.sh issue #226 regression test
        run: bash setup/test-update-issue-226.sh

      # issue #1143: a role with auto:false (synchronizer, extractor) was never
      # reinstalled, so an already-installed role's plist went stale forever —
      # fixed in PR #1178 (WP-529, peer session Claude+Kimi+Codex 10.10). Extracts
      # the real role-reinstall loop from update.sh and evals it with a mocked
      # launchctl — guards both the reinstall-by-presence fix and the set -e/grep
      # regression a first code-review pass caught before merge.
      - name: Run update.sh issue #1143 regression test
        run: bash setup/test-update-issue-1143.sh

      # WP-529 Phase 2 acceptance criterion: skipping a critical file and a wrong
      # route label must produce a deterministic failure with a clear
      # reason. Runs the real scripts/check-delivery-route-label.sh on a
      # throwaway git fixture -- does not rewrite its logic a second time.
      - name: Run delivery-route-label acceptance test
        run: bash setup/test-delivery-route-label.sh

      # WP-529 F7 acceptance: every runtime dependency of the Day Open pipeline
      # must resolve inside the delivery root (scripts/ + seed mirror), with
      # transitive closure over imports/sources — dynamic extraction from the
      # pipeline itself, no hand-kept list. Extension-graph dispatch is a strict
      # xfail until ArchGate Q1; an XPASS fails the run on purpose.
      - name: Run Day Open delivery-closure acceptance test
        run: bash setup/test-day-open-delivery-closure.sh

      - name: Run session guard and delivered ledger contract test
        run: bash scripts/tests/test_session_guard_hypothesis_gate.sh

      - name: Run delivered Day Open today-plan checks
        run: bash scripts/tests/day-open-llm-fill-today-plan-detect-smoke.sh

      - name: Run delivered Day Open world checks
        run: bash scripts/tests/day-open-world-fill-smoke.sh

      - name: Preserve unsaved work during Git housekeeping (issue #1245)
        run: |
          bash scripts/tests/pull-on-touch-ff-only-smoke.sh
          python3 scripts/tests/day-open-no-autostash-smoke.py

      # Issues #942/#944: calendar_source switch and stale priorities.yaml.
      - name: Run Day Open calendar switch and stale priorities test
        run: bash scripts/tests/test_issues_942_944_day_open.sh
      # Issues #919/#920/#929: scheduler row, uninstalled Scout, Day Close recognition.
      - name: Run Day Open traffic-light and Day Close recognition test
        run: bash scripts/tests/test_issues_919_920_929_day_open.sh
      # Issue #940: the Bash guard and its guarded-rm wrapper. Commands are passed to the hook
      # as data; nothing is executed.
      - name: Run destructive-guard tests
        run: |
          python3 .claude/hooks/tests/destructive-guard/hook_cases.py
          python3 .claude/hooks/tests/destructive-guard/long_cases.py
          python3 .claude/hooks/tests/destructive-guard/perf_cases.py
          python3 .claude/hooks/tests/destructive-guard/guarded_rm_cases.py .claude/bin/guarded-rm
          bash .claude/hooks/tests/test-destructive-guard-executed-command-scope.sh
          bash .claude/hooks/tests/test-destructive-guard-indirect-input.sh
          bash .claude/hooks/tests/test-destructive-guard-isolated-commit-and-deploy-key.sh
          bash .claude/hooks/tests/test-destructive-guard-malformed-json.sh
          bash scripts/tests/test_issue_1010_memory_limit.sh

      # WP-529 F7 follow-up (pilot decision 2026-08-21): update.sh delivers the
      # last published release by default, moving main only via explicit
      # IWE_UPDATE_CHANNEL=main or as an announced fallback when no release
      # exists. Stubbed-curl cases over the real resolve_delivery_ref().
      - name: Run update.sh release-channel test
        run: bash setup/test-update-release-channel.sh

      # Issue #943: manifest download with retries and a diagnostic; stubbed curl.
      - name: Run update.sh manifest fetch test
        run: bash setup/test-update-manifest-fetch.sh

      # WP-529 Phase 241: pins today's behaviour for a pilot-edited platform hook
      # (overwritten, no backup, no warning, second run is a no-op) on the real
      # update.sh in a sandbox with a curl shim and scheduler stubs.
      - name: Run update.sh modified-hook test
        run: bash setup/test-update-modified-hook.sh

      # WP-568 F11: an author host whose workspace .claude/ dirs are a read-only
      # mirror must finish the update (new file skipped with a warning) instead of
      # aborting on `cp: Permission denied` and leaving .update-incomplete behind.
      - name: Run update.sh author read-only mirror test
        run: bash setup/test-update-author-readonly-mirror.sh

      # WP-529 Phase 245: every write command in update.sh belongs to a block that
      # setup/update-write-sites.tsv classifies; the rollback plan is built from it.
      - name: Run update.sh write-sites registry test
        run: bash setup/test-update-write-sites.sh

      # WP-529 Phase 245 step 2: the frozen plan and the single executor of file
      # writes (setup/lib/apply-op.sh, not wired into update.sh yet), checked on
      # a synthetic install: every refusal leaves the tree unchanged.
      - name: Run apply-op executor test
        run: bash setup/test-apply-op.sh

      # WP-529 Phase 244: --check ends with one readiness verdict; refusals use the
      # same predicates as the real run and leave the install unchanged.
      - name: Run update.sh check verdict test
        run: bash setup/test-update-check-verdict.sh

      # Issue #941: the strategist's commit publisher shipped in seed/ and delivered by update.sh.
      - name: Run ds-publish tests
        run: |
          bash setup/test-ds-publish.sh
          bash setup/test-update-ds-publish-delivery.sh

      # issue #505 (live user-blocking): update.sh is delivered ONLY by Step 0
      # self-update — Step 5 must skip it (generic cp clobbered the running
      # inode; the placeholder pass baked install paths into its sed
      # templates). Full-run E2E against a sandboxed fixture.
      - name: Run update.sh self-overwrite regression test
        run: bash setup/test-update-self-overwrite.sh

      # v0.38.7 matrix finding 6: a foreign exported IWE_RUNTIME redirected
      # setup's hot-files generation into another workspace. Invariant with a
      # discriminating control (the old call shape must still leak).
      - name: Run setup runtime-isolation invariant test
        run: bash scripts/tests/test_setup_runtime_isolation.sh

      # issue #505 residual (Codex peer-review 2026-08-22): the test above
      # deliberately makes Step 0 a no-op, so the replacement itself had no
      # coverage. This one serves a DIFFERENT update.sh to the self-update
      # fetch: Step 0 must stage+rename it over the running script, re-exec,
      # and finish cleanly (#517: staged rename instead of cp).
      - name: Run update.sh Step 0 staged-rename test
        run: bash setup/test-update-step0-staged-rename.sh

      # PR #385: cloud install paths may occur legitimately in old tracked text;
      # only additions made by the current updater run are publication blockers.
      - name: Test staged install-path guard
        run: bash scripts/tests/test_update_install_path_guard.sh

      # WP-5 F55: the Extractor feeders step existed only in setup.sh, so every
      # already-configured machine kept updating without the capture pipeline
      # ever being scheduled. Guards the wiring plus install/opt-out/no-CLI paths.
      - name: Test Extractor feeders backfill in update.sh
        run: bash scripts/tests/test-update-extractor-feeders.sh

      # WP-529 Phase 3: release-receipt.sh (the release-receipt job below) must
      # fail closed — the Windows lock check must succeed; other mandatory
      # checks may succeed or be intentionally skipped. Anything else blocks.
      # Tested here the same way every other guard in
      # this job is: run against synthetic scenarios, not just imported.
      - name: Test release-receipt fail-closed logic
        run: bash scripts/tests/test_release_receipt.sh

      # WP-529 Phase 4 (peer-session 2026-08-20-06-wp546-wp529-update-parallel,
      # rewritten against the merged WP-546 Phase 2 implementation — commit
      # 8112b1a, curl --parallel — after an earlier draft of these three
      # tests targeted a since-abandoned parallel xargs/worker draft): three
      # negative delivery scenarios for update.sh Step 2's parallel fetch —
      # a network failure, a sha256 mismatch, and a file that never becomes
      # deliverable through the retry pass. Each must land in
      # SKIPPED_DOWNLOAD, never silently pass as delivered — if any of them
      # regressed, this job (RESULT_VALIDATE) goes red, which
      # release-receipt.sh (Phase 3, tested above) turns into publishable=false.
      - name: Test update.sh download_batch — network failure is fail-closed
        run: bash scripts/tests/test_update_download_batch_network_failure_failclosed.sh
      - name: Test update.sh verify_batch_integrity — sha256 mismatch is fail-closed
        run: bash scripts/tests/test_update_verify_batch_integrity_hash_mismatch_failclosed.sh
      - name: Test update.sh retry+classify — undeliverable file is fail-closed
        run: bash scripts/tests/test_update_retry_and_classify_undeliverable_file.sh

      # issue #310/#323: a guard hook not registered on any event
      # never fires -- and "did not fire" is indistinguishable from "no violations".
      - name: Check every hook is actually wired (orphan-hook guard)
        run: bash scripts/check-orphan-hooks.sh

      # The watchdog itself is also under test: both recognition paths (the claude-hook: false marker
      # and .orphan-allowlist) plus a guarantee that a real orphan still fails the check.
      - name: Test the orphan-hook guard itself (marker + allowlist + real orphan)
        run: bash scripts/tests/test_check_orphan_hooks.sh

      # ArchGate 03.09 (WP-5): the isolated inbox-check sandbox now
      # mounts the Pack repositories for duplicate checking -- read-only must be
      # real (file system), not just prompt text, otherwise the same
      # class of hole as in bug-2026-07-07-r15-decisions-bypassed-pilot.md.
      - name: Test read-only Pack mount is filesystem-enforced
        run: bash scripts/tests/test_mount_readonly_packs.sh

      # #1072: a disposable audit must reject service-manager calls even when
      # a nested installer swallows their status or removes the audit record.
      # The calibration uses only private PATH stubs, never host services.
      - name: Calibrate disposable Red Team boundary (#1072)
        run: bash .claude/skills/iwe-platform-redteam/tests/run-calibration.sh

      # WP-529 Phase 6 (Evgenii's findings 18.08): PyYAML is a declared dependency
      # (requirements.txt, #463), but CI did not guarantee it, and the whole family
      # scripts/tests/test_issue_*.sh sat in the repo not wired in -- the same
      # class of "the test exists, CI does not know about it" as issue #226 above.
      - name: Ensure PyYAML available for issue-regression tests (#463)
        run: |
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m pip install --user pyyaml 2>/dev/null && python3 -c "import yaml" 2>/dev/null && exit 0
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml

      # issue #894 steps 4-5: the routing block of a skill is mandatory and is
      # checked by the catalog generator's own rules (--validate-skill), the
      # same code route-task.sh --validate and verify-skill.sh run. Only the
      # SKILL.md files this push/PR changed are checked; a change to the rules
      # themselves (generator, its seed copy, route-task.sh, verify-skill.sh)
      # re-checks every skill. No usable base (schedule, workflow_dispatch,
      # first push of a branch, rewritten history) also checks every skill —
      # about 5 s, so the fallback costs nothing worth saving.
      - name: Validate routing block of changed skills (issue #894)
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "push" ]; then
            BASE="${{ github.event.before }}"
          elif [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE=""
          fi
          ALL=false
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable diff base for '$EVENT' (base '${BASE:-none}'): checking every skill"
            ALL=true
          else
            CHANGED=$(git diff --name-only --diff-filter=d "$BASE" HEAD)
            if printf '%s\n' "$CHANGED" | grep -qxE 'scripts/generate-executor-catalog\.py|seed/strategy/scripts/generate-executor-catalog\.py|scripts/route-task\.sh|\.claude/skills/skill-creator/scripts/verify-skill\.(sh|py)|\.claude/skills/skill-creator/assets/skill-scaffold-[a-z]+\.md'; then
              echo "Routing rules changed: checking every skill"
              ALL=true
            fi
          fi
          if [ "$ALL" = true ]; then
            SKILLS=$(ls .claude/skills/*/SKILL.md)
          else
            SKILLS=$(printf '%s\n' "$CHANGED" | grep -E '^\.claude/skills/[^/]+/SKILL\.md$' || true)
          fi
          if [ -z "$SKILLS" ]; then
            echo "PASS: no SKILL.md changed since $BASE"
            exit 0
          fi
          failed=0
          while IFS= read -r skill_md; do
            python3 scripts/generate-executor-catalog.py \
              --validate-skill "$(dirname "$skill_md")" --template-root "$PWD" || failed=1
          done <<< "$SKILLS"
          if [ "$failed" -ne 0 ]; then
            echo "::error::routing block check failed for at least one SKILL.md (see FAIL lines above)"
            exit 1
          fi

      # A single versioned runner: a new test_issue_*.sh is wired in by the mere
      # fact of the file appearing; forgetting to wire it into CI is no longer possible.
      - name: Run issue-regression tests (single runner, WP-529 Ф6)
        run: bash scripts/tests/run-issue-tests.sh

      # Cold review 2026-08-19 (Medium): the runner above runs only .sh -- the three
      # python regressions of the family otherwise run nowhere (the same class of
      # "the test exists, CI does not know about it"). WP-7 Phase 284: 8 more files (agent
      # panel, rehearsal gate, glossary snapshot, etc.) were previously run only by a
      # non-blocking step in the gateway CI on a pinned template revision.
      - name: Run issue-regression python tests (pytest, WP-529 Ф6)
        run: |
          python3 -c "import pytest, markdown_it, yaml" >/dev/null 2>&1 || python3 -m pip install --user pytest markdown-it-py pyyaml
          python3 -m pytest -q \
            scripts/tests/test_issue_*.py \
            scripts/tests/test_agent_dashboard.py \
            scripts/tests/test_dry_run_gate.py \
            scripts/tests/test_export_glossary_snapshot.py \
            scripts/tests/test_fetch_glossary_concepts.py \
            scripts/tests/test_manifest_coverage_local.py \
            scripts/tests/test_pending_lock.py \
            scripts/tests/test_sync_banner.py \
            scripts/tests/test_translate_parse.py \
            scripts/tests/test_day_close_prepare.py \
            scripts/tests/test_create_wp_number_padding.py \
            scripts/tests/test_create_wp_weekplan_writer.py \
            scripts/tests/test_install_hooks.py \
            scripts/tests/test_skill_promote.py \
            scripts/tests/test_residency_gate_skill_adapter.py \
            scripts/tests/test_release_notice_build.py \
            roles/extractor/tests/test_extractor_pipeline.py
          # The skill directory contains a hyphen, so pytest cannot import it
          # as a package reliably; both files are executable unit suites.
          python3 .claude/skills/residency-gate/tests/test_parser.py
          python3 .claude/skills/residency-gate/tests/test_pre_grant.py

      # A build-runtime failure must leave .update-incomplete and make update.sh fail
      # with a non-zero code; the TOTAL_CHANGES=0 recovery branch must do so as well.
      - name: Test update.sh build-runtime fail-closed contract (WP-529 Ф6)
        run: bash scripts/tests/test_update_build_runtime_fail_closed.sh

      # Delivery-order invariant: the python resolver is synchronized before
      # any role reload; consumers go only through the shared resolver.
      - name: Test python-resolver delivery order invariant (WP-529 Ф6)
        run: bash scripts/tests/test_update_delivers_python_resolver_before_roles.sh

      # A role's mutating runner must skip the run while the incomplete-update
      # marker is open (a RunAtLoad shot when roles are reinstalled).
      - name: Test role-runner update-marker guard (WP-529 Ф6)
        run: bash scripts/tests/test_role_runner_update_marker_guard.sh

      # 7. Only allowed placeholders
      - name: Check placeholders are valid
        run: |
          # Найти все {{...}} и проверить что они из допустимого списка
          ALLOWED="HOME_DIR|WORKSPACE_DIR|GITHUB_USER|CLAUDE_PATH|CLAUDE_PROJECT_SLUG|TIMEZONE_HOUR|TIMEZONE_DESC"
          INVALID=$(grep -rohP '\{\{[A-Z_]+\}\}' . --include="*.md" --include="*.sh" \
                    --include="*.json" --include="*.plist" 2>/dev/null \
                    | sort -u \
                    | grep -vP "\{\{($ALLOWED)\}\}" || true)
          if [ -n "$INVALID" ]; then
            echo "WARN: Unknown placeholders found:"
            echo "$INVALID"
            echo "(This is a warning, not a failure — new placeholders may be intentional)"
          else
            echo "PASS: All placeholders are valid"
          fi

  # The Ubuntu guard suite cannot enter guarded-rm's cygpath branch or its
  # Windows-only path, junction, and command-failure cases.
  guarded-rm-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run guarded-rm Windows cases
        shell: bash
        run: |
          export PYTHONIOENCODING=utf-8
          python -c 'import os, sys; sys.exit(0 if os.name == "nt" else "native Windows Python required")'
          command -v cygpath
          GRM_BASH="$(cygpath -w "$BASH")"
          export GRM_BASH
          python -c 'import os, subprocess; subprocess.run([os.environ["GRM_BASH"], "-c", "command -v cygpath"], check=True)'
          python .claude/hooks/tests/destructive-guard/guarded_rm_cases.py .claude/bin/guarded-rm

  # WP-529 Phase 3: single fail-closed receipt for this commit, built from the
  # results of THIS workflow run (needs.<job>.result — same trigger, same
  # SHA), not from querying job status elsewhere. `if: always()` so a
  # failure upstream still produces a receipt recording that failure,
  # instead of the receipt job itself being skipped and leaving no artifact
  # to show why the commit isn't publishable. integration-contract-macos is
  # included even though it runs only on pull_request/schedule and on a
  # release run (see its own `if:` above) — on an ordinary push its result is
  # "skipped", which release-receipt.sh lists as «пропущено», not as success;
  # on a release run (#1010a) the receipt fails on that skip, so a release
  # cannot ship without the macOS proof.
  release-receipt:
    needs:
      - release-sync
      - integration-contract-ubuntu
      - integration-contract-macos
      - issue-1030-windows
      - shellcheck
      - platform-compat
      - validate
      - guarded-rm-windows
      - upgrade-test
      - guide-kit-drift
      - windows-session-guard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # release-receipt.sh needs full update-manifest.json history to resolve base_sha
      - name: Build release receipt
        env:
          RESULT_RELEASE_SYNC: ${{ needs.release-sync.result }}
          RESULT_INTEGRATION_CONTRACT_UBUNTU: ${{ needs.integration-contract-ubuntu.result }}
          RESULT_INTEGRATION_CONTRACT_MACOS: ${{ needs.integration-contract-macos.result }}
          RESULT_ISSUE_1030_WINDOWS: ${{ needs.issue-1030-windows.result }}
          RESULT_SHELLCHECK: ${{ needs.shellcheck.result }}
          RESULT_PLATFORM_COMPAT: ${{ needs.platform-compat.result }}
          RESULT_VALIDATE: ${{ needs.validate.result }}
          RESULT_GUARDED_RM_WINDOWS: ${{ needs.guarded-rm-windows.result }}
          RESULT_UPGRADE_TEST: ${{ needs.upgrade-test.result }}
          RESULT_GUIDE_KIT_DRIFT: ${{ needs.guide-kit-drift.result }}
          RESULT_WINDOWS_SESSION_GUARD: ${{ needs.windows-session-guard.result }}
        run: bash scripts/release-receipt.sh
      - name: Upload release receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-receipt
          path: release-receipt.json
